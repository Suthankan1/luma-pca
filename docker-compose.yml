name: luma-pca-local
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-luma}
      POSTGRES_USER: ${DB_USER:-luma_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - luma_postgres_data:/var/lib/postgresql/data
volumes:
  luma_postgres_data:
