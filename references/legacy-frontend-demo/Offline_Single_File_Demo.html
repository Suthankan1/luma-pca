function renderStudentReactions(){let n=Object.values(state.portalReactions).reduce((a,b)=>a+b,0);return `${head('Learner / Live participation','React to your classroom.','These verified reactions belong to the academy-owned student portal — not Zoom’s native emojis.',button(`${ic('bolt')} Answer a pulse`,'student:pulse'))}
<div class="grid two"><section class="hero" style="min-height:190px"><span class="pill cyan">LIVE / ADVANCED MATHEMATICS</span><h2>Your learning voice.</h2><p>Use a quick gesture to show appreciation, agreement or a question.</p><div class="hero-count" style="font-size:52px">${n}<small>portal reactions this demo</small></div></section>
${card('Reaction controls','Linked to PCA-1001 only; stored in this browser.',`<div class="reaction-grid">${reactivityTypes.map(([key,emoji,label])=>`<button type="button" class="reaction-btn" data-action="react:${key}" aria-label="React with ${label}"><span class="reaction-emoji">${emoji}</span><strong>${safe(label)}</strong><span class="reaction-count">${state.portalReactions[key]||0} taps</span></button>`).join('')}</div><div class="muted text-xs mt-18">For a real app, add server-side throttling and anti-spam limits.</div>`)}</div>
<div class="section-gap">${notice('Reaction rankings derived from <strong>Zoom’s own emoji button</strong> are not promised. This portal demonstrates an identifiable alternative; Q&A and poll reports remain separate evidence channels.')}</div>`}
function renderStudentProfile(){let s=STUDENTS[0];return `${head('Learner / My data','Your profile, explained.','You should be able to understand and question your educational data.',button('Request correction','request-correction','outline'))}
<div class="grid two"><section class="student-panel"><div class="initials">AF</div><h2>${safe(s.name)}</h2><p>${safe(s.id)} / Batch A4</p><hr><h2>Physics Cube Academy</h2><p>Student engagement and attendance portal</p><div style="margin-top:40px">${pill('Identified portal account','cyan')}</div></section>
${card('Data transparency','What this demonstration models',`<div>${[['Attendance history','Join and leave intervals by webinar'],['Q&A participation','Identifiable questions, when available'],['Custom reactions','Only gestures pressed in this portal'],['Pulse submissions','Time-stamped answers entered here'],['Identity review','Correction requests for mismatched records'],['Data location','Only this browser; not sent to any server']].map(([a,b])=>`<div class="list-row"><div class="left"><strong>${safe(a)}</strong><small>${safe(b)}</small></div>${ic('check')}</div>`).join('')}</div>`)}</div>`}
function modalView(){if(!state.modal)return '';let body='',title='',actions='';const m=state.modal;
if(m.type==='review') {const x=state.exceptions.find(y=>y.id===m.id);if(!x)return '';title=`Review / ${x.id}`;body=`<div class="column"><div class="spaced"><strong>${safe(x.student)}</strong>${presentStatus(x.state)}</div><div class="notice warning">${ic('alert')}<span>${safe(x.issue)}. ${safe(x.detail)}</span></div><label><span class="field-label">Decision note (required)</span><textarea id="reviewReason" class="input" rows="3" style="resize:vertical;min-height:88px" placeholder="Explain the evidence used for this decision…">${safe(state.reviewReason)}</textarea></label>${x.type==='Identity mismatch'?`<label><span class="field-label">Match to a verified student (optional)</span><select class="select" id="matchStudent"><option value="">Leave unresolved / use staff judgment</option>${STUDENTS.slice(0,20).map(s=>`<option value="${s.id}" ${state.matchedStudent===s.id?'selected':''}>${safe(s.id+' — '+s.name)}</option>`).join('')}</select></label>`:''}<p class="muted text-xs">This decision affects local demonstration records only.</p></div>`;actions=`${button('Cancel','close-modal','outline')}${button('Mark reviewed','resolve:'+x.id)}`;}
else if(m.type==='reset'){title='Reset the demonstration?';body='<p class="subtitle">This clears your local pulse answers, reaction taps, review decisions and attendance policy changes. The original fictional sample data will be restored.</p>';actions=`${button('Keep my changes','close-modal','outline')}${button('Reset everything','reset-demo')}`}
else if(m.type==='correction'){title='Request an attendance correction';body=`<div class="form-stack"><label><span class="field-label">Reason for correction</span><textarea id="correctionReason" class="input" rows="4" style="min-height:110px" placeholder="Example: I disconnected and rejoined using a different registered device…"></textarea></label><p class="muted text-xs">This demonstration does not send a request to an actual academy employee.</p></div>`;actions=`${button('Cancel','close-modal','outline')}${button('Submit demo request','submit-correction')}`}
else if(m.type==='pulse-success'){title='Response recorded';body=`<div class="callout">${ic('check')}<div><strong>Your participation event was saved.</strong><p>The sample student record now includes this pulse response. It is not a Zoom poll response.</p></div></div>`;actions=button('Continue learning','close-modal');}
else if(m.type==='help'){title=m.title||'Demo information';body=`<p class="subtitle">${safe(m.body||'This is a frontend demonstration.')}</p>`;actions=button('Understood','close-modal');}
return `<div class="modal-backdrop" role="presentation" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="${safe(title)}" data-modal-panel><div class="spaced"><div class="eyebrow">Physics Cube Academy / LUMA</div><button class="btn outline icon-only" type="button" aria-label="Close modal" data-action="close-modal">${ic('x')}</button></div><h2>${safe(title)}</h2>${body}<div class="modal-actions">${actions}</div></div></div>`}
function sidebar(){let role=state.role,links=role==='staff'?staffNav:studentNav,current=role==='staff'?state.page:state.studentPage;let split=role==='staff'?7:3;
return `<aside class="sidebar ${state.showSidebar?'open':''}" aria-label="Main navigation"><div class="brand"><div class="brand-mark"><img src="${LOGO}" alt="Physics Cube Academy logo" /></div><span class="brand-word">luma.</span></div><div class="brand-sub">PRESENCE INTELLIGENCE</div><div class="nav-div"></div><div class="nav-label">${role==='staff'?'Operations desk':'My classroom'}</div><div class="nav-list">${links.map(([id,title,iconName],i)=>`${i===split?'<div class="nav-label">'+(role==='staff'?'Management & system':'My account')+'</div>':''}<button type="button" class="nav-item ${id===current?'active':''}" data-action="${role==='staff'?'nav':'student'}:${id}">${ic(iconName)}<span>${safe(title)}</span></button>`).join('')}</div><div class="sidebar-spacer"></div><div class="org-chip"><strong>PHYSICS CUBE ACADEMY</strong><small>Offline interactive demo · No Zoom connection</small></div></aside>`}
function topbar(){return `<header class="topbar"><div class="flex"><button type="button" class="mobile-menu-button" aria-label="Open menu" data-action="toggle-menu">${ic('menu')}</button><span class="top-kicker">${state.role==='staff'?'ACADEMY / OPERATIONS':'LEARNER / PORTAL'}</span></div><div class="top-actions"><span class="muted text-xs hide-sm">${TODAY}</span><div class="role-toggle" role="group" aria-label="Choose demo experience"><button type="button" class="role-option ${state.role==='staff'?'active':''}" data-action="role:staff">Staff</button><button type="button" class="role-option ${state.role==='student'?'active':''}" data-action="role:student">Student</button></div><span class="avatar">${state.role==='staff'?'NP':'AF'}</span></div></header>`}
function bottomBar(){let links=state.role==='student'?[['home','Home','grid'],['classes','Classes','calendar'],['pulse','Pulse','bolt'],['profile','Profile','person']]:[['overview','Home','grid'],['live','Live','radio'],['attendance','Roster','calendar'],['reports','Reports','chart']];let current=state.role==='student'?state.studentPage:state.page;return `<nav class="mobile-bottom" aria-label="Mobile navigation">${links.map(([id,label,iconName])=>`<button type="button" data-action="${state.role==='student'?'student':'nav'}:${id}" class="${current===id?'active':''}">${ic(iconName)}<span>${label}</span></button>`).join('')}</nav>`}
function renderPage(){let staff={overview:renderOverview,live:renderLive,attendance:renderAttendance,students:renderStudents,engagement:renderEngagement,checks:renderChecks,ranking:renderRanking,reports:renderReports,exceptions:renderExceptions,directory:renderDirectory,zoom:renderZoom,policies:renderPolicies};let learner={home:renderStudentHome,classes:renderStudentClasses,pulse:renderStudentPulse,reactions:renderStudentReactions,profile:renderStudentProfile};return state.role==='staff'?(staff[state.page]||renderOverview)():(learner[state.studentPage]||renderStudentHome)()}
function render(){el.innerHTML=`<div class="app-shell">${sidebar()}<div class="backdrop ${state.showSidebar?'show':''}" data-action="close-menu"></div><div class="workspace">${topbar()}<main class="content">${renderPage()}<footer class="page-foot"><span>© Physics Cube Academy / LUMA — fictional classroom dataset for IS 3610 academic demonstration.</span><span>100% frontend · No Zoom account connected · No external requests</span></footer></main></div>${bottomBar()}</div>${modalView()}`;save();}
function toast(message){toastEl.innerHTML=`<div class="toast">${ic('check')}<span>${safe(message)}</span></div>`;clearTimeout(window.__lumaToastTimeout);window.__lumaToastTimeout=setTimeout(()=>{toastEl.innerHTML=''},3200)}
function navigate(role,page){state.role=role;if(role==='staff'){state.page=page;state.search='';}else{state.studentPage=page;}state.showSidebar=false;state.modal=null;state.answer=-1;history.replaceState({},'',`#${role}/${page}`);render();window.scrollTo({top:0,behavior:'instant'});}
function makeCSV(rows){return rows.map(row=>row.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\r\n')+'\r\n'}
function exportCsv(filename,rows){let blob=new Blob(['\ufeff'+makeCSV(rows)],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast(`${filename} downloaded (sample data)`) }
function csvRows(type){if(type==='attendance')return [['Student ID','Student name','Webinar ID','Webinar title','Class date','Connected minutes','Scheduled minutes','Attendance percent','Result'],...WEBINARS.flatMap(w=>STUDENTS.filter(s=>s.batch===w.batch).map(s=>{let a=attendanceFor(s.id,w.id);return[s.id,s.name,w.id,w.title,w.date,a.connected,w.minutes,fmtPct(a.rate),a.status]}))];
if(type==='ranking')return [['Rank','Student ID','Student name','Classes','Portal reactions','Identifiable Q&A','Checks','Participation index'],...[...STUDENTS].sort((a,b)=>scoreOf(b)-scoreOf(a)).slice(0,state.topN).map((s,i)=>[i+1,s.id,s.name,s.classes,rankingScore(s).reactions,s.questions,rankingScore(s).checks,scoreOf(s)])];
if(type==='reactions')return [['Student ID','Student name','Heart (demo session)','Like (demo session)','Clap (demo session)','Question gesture (demo session)','Total portal reactions'],['PCA-1001',STUDENTS[0].name,...Object.keys(state.portalReactions).map(k=>state.portalReactions[k]),Object.values(state.portalReactions).reduce((a,b)=>a+b,0)]];
if(type==='exceptions')return [['Exception ID','Student','Type','Problem','Status','Staff note'],...state.exceptions.map(x=>[x.id,x.student,x.type,x.issue,x.state,x.note||''])];
if(type==='webinars')return [['Webinar ID','Title','Batch','Instructor','Date','Time','Scheduled minutes','State'],...WEBINARS.map(w=>[w.id,w.title,w.batch,w.instructor,w.date,w.time,w.minutes,w.status])];
if(type==='pulse')return [['Question','Answer','Correct','Recorded at'],...state.pulseSubmissions.map(x=>[x.question,x.answer,x.correct,x.time])];return[]}
function doExport(type){if(type==='class'){let w=webinar(state.selectedClass);let rows=[['Student ID','Student name','Connected minutes','Scheduled minutes','Attendance rate','Result'],...STUDENTS.filter(s=>s.batch===w.batch).map(s=>{let a=attendanceFor(s.id,w.id);return[s.id,s.name,a.connected,w.minutes,fmtPct(a.rate),a.status]})];return exportCsv(`physics-cube-${w.id}-attendance.csv`,rows)}exportCsv(`physics-cube-${type}-demo.csv`,csvRows(type));}
function resetDemo(){state=defaultState();try{localStorage.removeItem(STORAGE_KEY)}catch(e){}history.replaceState({},'','#staff/overview');render();toast('Demo data reset to original sample')}
function handleAction(str){let [action,argument]=str.split(':');
if(action==='nav')return navigate('staff',argument);
if(action==='student')return navigate('student',argument);
if(action==='role')return navigate(argument,argument==='student'?'home':'overview');
if(action==='toggle-menu'){state.showSidebar=!state.showSidebar;return render()}
if(action==='close-menu'){state.showSidebar=false;return render()}
if(action==='close-modal'){state.modal=null;return render()}
if(action==='open-student'){state.selectedStudent=argument;return navigate('staff','students')}
if(action==='top'){state.topN=Number(argument);return render()}
if(action==='review'){state.modal={type:'review',id:argument};state.reviewReason='';state.matchedStudent='';return render()}
if(action==='resolve'){let x=state.exceptions.find(v=>v.id===argument);let input=document.getElementById('reviewReason'),reason=input?.value.trim()||'';if(reason.length<8)return toast('Add a review note of at least 8 characters');if(x){x.state='Reviewed';x.note=reason;let match=document.getElementById('matchStudent')?.value;if(match)x.studentId=match;}state.modal=null;render();return toast(`Review recorded for ${argument}`)}
if(action==='reset-confirm'){state.modal={type:'reset'};return render()}
if(action==='reset-demo')return resetDemo();
if(action==='start-live'){state.liveRunning=true;render();return toast('Demo event simulation started')}
if(action==='stop-live'){state.liveRunning=false;render();return toast('Simulation paused')}
if(action==='tick-live'){state.liveTicks++;return render()}
if(action==='prev-question'){state.questionIndex=(state.questionIndex-1+QUESTIONS.length)%QUESTIONS.length;state.answer=-1;return render()}
if(action==='next-question'){state.questionIndex=(state.questionIndex+1)%QUESTIONS.length;state.answer=-1;return render()}
if(action==='open-pulse-preview')return navigate('student','pulse');
if(action==='answer'){state.answer=Number(argument);return render()}
if(action==='submit-pulse'){if(state.answer<0)return toast('Choose one answer first');const q=QUESTIONS[state.questionIndex],answer=q.answers[state.answer];state.pulseSubmissions.push({questionId:q.id,question:q.question,answer,correct:state.answer===q.correct?'Yes':'No',time:new Date().toLocaleString()});state.answer=-1;state.modal={type:'pulse-success'};return render()}
if(action==='react'){if(!(argument in state.portalReactions))return;let total=Object.values(state.portalReactions).reduce((a,b)=>a+b,0);if(total>=120)return toast('Demo reaction limit reached (120 per session)');state.portalReactions[argument]++;render();return toast('Portal reaction recorded for PCA-1001')}
if(str.startsWith('export-')){const type=str.slice('export-'.length);if(type==='all'){for(const v of ['attendance','ranking','reactions','exceptions','webinars','pulse'])doExport(v);return;}return doExport(type)}
if(action==='simulate-sync')return toast('Demo refresh complete — no Zoom request was made');
if(action==='save-policy'){render();return toast('Demo attendance policy updated')}
if(action==='request-correction'){state.modal={type:'correction'};return render()}
if(action==='submit-correction'){let v=document.getElementById('correctionReason')?.value.trim()||'';if(v.length<12)return toast('Please provide at least 12 characters');state.modal=null;render();return toast('Correction request recorded as a demo (not sent)')}
return toast('This action is a visual demo only');
}
function onChange(t){const op=t.dataset.change;if(op==='class'){state.selectedClass=t.value;state.search='';return render()}if(op==='ranking-sort'){state.sortRanking=t.value;return render()}if(op==='threshold'){state.threshold=Number(t.value);return render()}}
document.addEventListener('click',e=>{if(e.target.closest('[data-modal-panel]')&&!e.target.closest('button[data-action]'))return;const trigger=e.target.closest('[data-action]');if(!trigger)return;e.preventDefault();if(trigger.disabled)return;handleAction(trigger.getAttribute('data-action'));});
document.addEventListener('input',e=>{const inp=e.target.closest('[data-input]');if(!inp)return;state.search=inp.value;let id=inp.id,pos=inp.selectionStart;render();const next=document.getElementById(id);if(next){next.focus();try{next.setSelectionRange(pos,pos)}catch(err){}}});
document.addEventListener('change',e=>{let inp=e.target.closest('[data-change]');if(inp)onChange(inp)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render()} });
window.addEventListener('hashchange',()=>{let parts=location.hash.replace(/^#/,'').split('/');if(parts.length===2&&['staff','student'].includes(parts[0]))navigate(parts[0],parts[1])});
let route=location.hash.replace(/^#/,'').split('/');if(route.length===2&&['staff','student'].includes(route[0])){state.role=route[0];if(route[0]==='staff')state.page=route[1];else state.studentPage=route[1];}
setInterval(()=>{if(state.liveRunning){state.liveTicks++;if(state.role==='staff'&&state.page==='live')render()}},4000);
render();
})();

</script>
</body>
</html>
