name: Frontend checks
on:
  push:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: ESLint
        run: npm --prefix frontend run lint
      - name: Type check
        run: npm --prefix frontend run typecheck
      - name: Unit tests
        run: npm --prefix frontend test
      - name: Production build
        run: npm --prefix frontend run build
      - name: Session HTTP smoke test
        run: npm --prefix frontend run test:smoke
      - name: Signed-in Lighthouse budgets
        working-directory: frontend
        run: |
          export LUMA_LIGHTHOUSE_TOOLS="$RUNNER_TEMP/luma-lighthouse"
          npm --prefix "$LUMA_LIGHTHOUSE_TOOLS" install --no-save --package-lock=false lighthouse@12.8.2 chrome-launcher@1.2.1
          node tests/mock-auth-runner.mjs &
          mock_pid=$!
          trap 'kill "$mock_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3090/sign-in && break; sleep 1; done
          node tests/staff-lighthouse.mjs

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Microsoft's Playwright image ships Chromium and its Linux libraries, so this job
    # needs no apt-get and no browser download (both slow, and failing whenever the
    # runner cannot reach Ubuntu's package servers). The tag must equal the
    # @playwright/test version in frontend/package-lock.json; the first step checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Playwright version matches the container image
        run: |
          installed="$(node -p "require('./frontend/node_modules/@playwright/test/package.json').version")"
          test "$installed" = "1.65.0" || { echo "::error::@playwright/test is $installed; update the container tag to v$installed"; exit 1; }
      - name: Production build
        run: npm --prefix frontend run build
      - name: End-to-end browser tests
        run: npm --prefix frontend run test:e2e
      # Traces, screenshots and page snapshots of failed attempts (mock data only), to diagnose flaky runs.
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
