name: terraform

# Checks the infrastructure code only: formatting and validity. It never runs plan or apply and
# has no AWS credentials; creating resources needs the academy's budget approval (infra/AGENTS.md).
on:
  pull_request:
    paths: ['infra/**', '.github/workflows/terraform.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/terraform.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: hashicorp/terraform:1.9.8
    steps:
      - uses: actions/checkout@v4
      - name: Formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Validate staging
        run: |
          terraform -chdir=infra/terraform/environments/staging init -backend=false -input=false
          terraform -chdir=infra/terraform/environments/staging validate
