    post:
      summary: Signed Zoom webhook ingress (implemented; off unless configured; verified against fixtures only)
      description: |
        No academy JWT: the Zoom signature is the credential. Requires x-zm-request-timestamp (epoch seconds,
        within 5 minutes) and x-zm-signature = "v0=" + hex HMAC-SHA256(secret token, "v0:<timestamp>:<raw body>").
        endpoint.url_validation is answered; webinar.started/ended/participant_joined/participant_left are stored
        durably before the 2xx; other verified types are acknowledged and dropped. Redeliveries of an identical body
        are acknowledged without a second receipt.
      operationId: receiveZoomWebhook
      tags: [Zoom]
      security: []
      parameters:
        - {in: header, name: x-zm-request-timestamp, required: true, schema: {type: string}}
        - {in: header, name: x-zm-signature, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [event], properties: {event: {type: string}, event_ts: {type: integer}, payload: {type: object}}}
      responses:
        '200':
          description: Stored, already stored, or ignored; for url_validation the body holds plainToken and encryptedToken
          content:
            application/json:
              schema:
                type: object
                properties:
                  plainToken: {type: string}
                  encryptedToken: {type: string}
        '400': {description: Verified but malformed (not a JSON object, no event, no event_ts, or unacceptable plainToken)}
        '401': {description: Missing, malformed, stale or mismatched signature (empty body)}
        '404': {description: Webhook ingress is not configured}
        '413': {description: Body over 64 KiB}
        '415': {description: Not application/json}
        '503': {description: Receipt could not be stored; Zoom retries 5xx}
  /api/v1/auth/student-id-login:
    get: {summary: "Whether the Academy-requested student ID sign-in is switched on (ACAD-2)", operationId: studentIdLoginAvailability, tags: [Identity], responses: {'200': {description: "enabled"}}}
    post: {summary: "Academy-requested student sign-in: the student ID is username and password. Weak by design; off unless LUMA_STUDENT_ID_LOGIN_ENABLED; students only (ACAD-2)", operationId: studentIdLogin, tags: [Identity], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [studentId, password], properties: {studentId: {type: string, maxLength: 60}, password: {type: string, maxLength: 60, writeOnly: true}}}}}}, responses: {'200': {description: "Tokens (as /auth/login)"}, '400': {description: Malformed request}, '401': {description: "Refused. Identical for unknown ID, wrong password, deactivated student, staff account and another academy"}, '404': {description: Switched off}, '429': {description: Too many attempts from this client}}}
  /api/v1/academy/classes:
    get: {summary: "The Academy's classes from its own database (read-only): distinct-student counts and the linked LUMA batch (staff; ACAD-1)", operationId: listAcademyClasses, tags: [Academy], security: [{bearerAuth: []}], responses: {'200': {description: "className, studentCount, batch (null until linked)"}, '403': {description: Not staff}, '503': {description: The Academy database is not connected or unreachable}}}
  /api/v1/academy/classes/link:
    put: {summary: "Link an Academy class to an active batch of the academy; one class per batch (staff; audited)", operationId: linkAcademyClass, tags: [Academy], security: [{bearerAuth: []}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [className, batchId], properties: {className: {type: string, maxLength: 200}, batchId: {type: string, format: uuid}}}}}}, responses: {'200': {description: The class with its batch}, '404': {description: No such Academy class or batch}, '409': {description: Batch inactive or linked to another class}}}
  /api/v1/academy/classes/sync:
    post: {summary: "Bring the linked batch's enrolments in step with the Academy class: create missing students, enrol; never withdraws (staff; audited with counts only)", operationId: syncAcademyClass, tags: [Academy], security: [{bearerAuth: []}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [className], properties: {className: {type: string, maxLength: 200}}}}}}, responses: {'200': {description: "academyStudents, created, enrolled, alreadyEnrolled, withoutName, withoutEmail, withdrawnInLuma, inactiveInLuma, invalidIds, notInAcademyClass"}, '404': {description: Not linked}, '503': {description: The Academy database is not connected or unreachable}}}
  /api/v1/attendance/dashboard:
    get: {summary: "Attendance dashboard: every student of a course or batch over the classes held in a date range — time in the webinar (rejoins merged), share of class time, outcomes, per-class cells (staff; batch-scoped staff see their batches)", operationId: attendanceDashboard, tags: [Attendance], security: [{bearerAuth: []}], parameters: [{in: query, name: from, schema: {type: string, format: date}}, {in: query, name: to, schema: {type: string, format: date}}, {in: query, name: courseId, schema: {type: string, format: uuid}}, {in: query, name: batchId, schema: {type: string, format: uuid}}], responses: {'200': {description: "from, to, truncated, totals, classes[], students[] with cells[] in class order"}, '400': {description: Range over 92 days or reversed}}}
  /api/v1/attendance/class-totals:
    get:
      summary: Joined and expected student counts per completed class visible to staff
      description: Filters by class start date, inclusive in Asia/Colombo, and defaults to the last 30 days. Shared classes are counted once, with students limited to the caller's visible batches. Joined counts expected students with matched Zoom visits, counting rejoins once.
      operationId: attendanceClassTotals
      tags: [Attendance]
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: from, schema: {type: string, format: date}}
        - {in: query, name: to, schema: {type: string, format: date}}
      responses:
        '200':
          description: Counts in class start order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, expected, joined]
                  properties:
                    id: {type: string, format: uuid}
                    expected: {type: integer, minimum: 0}
                    joined: {type: integer, minimum: 0}
        '400': {description: Range over 92 days or reversed}
        '401': {description: Sign-in required}
        '403': {description: Staff role with class access required}
  /api/v1/students/{studentId}/attendance-overview:
    get: {summary: "One student's courses, batches and every class in a date range with each join and leave (staff)", operationId: studentAttendanceOverview, tags: [Attendance], security: [{bearerAuth: []}], parameters: [{in: path, name: studentId, required: true, schema: {type: string, format: uuid}}, {in: query, name: from, schema: {type: string, format: date}}, {in: query, name: to, schema: {type: string, format: date}}], responses: {'200': {description: "overall, byBatch[], enrolments[], classes[] with timeline[]"}, '404': {description: No such student in the academy}}}
  /api/v1/me/attendance-overview:
    get: {summary: "The signed-in student's own attendance overview, as the staff one", operationId: myAttendanceOverview, tags: [Attendance], security: [{bearerAuth: []}], parameters: [{in: query, name: from, schema: {type: string, format: date}}, {in: query, name: to, schema: {type: string, format: date}}], responses: {'200': {description: "overall, byBatch[], enrolments[], classes[] with timeline[]"}}}
  /api/v1/zoom/monitors:
    get: {summary: "Monitored Zoom webinars with Zoom's read-only title and schedule, the live run and recent runs (staff; WID)", operationId: listWebinarMonitors, tags: [Zoom], security: [{bearerAuth: []}], responses: {'200': {description: "id, webinarId, topic, timeZone, scheduledStartAt (null = no Zoom schedule), occurrences, syncStatus, syncedAt, academyClassName, classResolved, active, live, runs[]"}}}
    post: {summary: "Monitor a webinar by its ID or join link only; title and schedule are read from Zoom (staff; audited). LUMA never changes the webinar", operationId: addWebinarMonitor, tags: [Zoom], security: [{bearerAuth: []}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [webinar], properties: {webinar: {type: string, maxLength: 500, description: "Webinar ID or join link"}}}}}}, responses: {'200': {description: The monitored webinar}, '400': {description: Not a webinar ID or supported link}, '404': {description: Not in the academy's Zoom account}, '503': {description: Zoom API not configured}}}
  /api/v1/zoom/monitors/{monitorId}/sync:
    post: {summary: "Read the webinar's title and schedule from Zoom again", operationId: syncWebinarMonitor, tags: [Zoom], security: [{bearerAuth: []}], parameters: [{in: path, name: monitorId, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: The monitored webinar (syncStatus FAILED/NOT_FOUND keeps the last known values)}, '404': {description: Not monitored}}}
  /api/v1/zoom/monitors/{monitorId}/stop:
    post: {summary: "Stop collecting the webinar in LUMA (the Zoom webinar is untouched; runs and attendance kept; audited)", operationId: stopWebinarMonitor, tags: [Zoom], security: [{bearerAuth: []}], parameters: [{in: path, name: monitorId, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: The monitored webinar}}}
  /api/v1/zoom/monitors/{monitorId}/resume:
    post: {summary: "Resume collecting the webinar (audited)", operationId: resumeWebinarMonitor, tags: [Zoom], security: [{bearerAuth: []}], parameters: [{in: path, name: monitorId, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: The monitored webinar}}}
  /api/v1/zoom/monitors/{monitorId}/academy-class:
    put: {summary: "A staff member's explicit choice of the Academy class the webinar teaches, or null for unresolved (audited)", operationId: setWebinarAcademyClass, tags: [Zoom], security: [{bearerAuth: []}], parameters: [{in: path, name: monitorId, required: true, schema: {type: string, format: uuid}}], requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {academyClassName: {type: string, maxLength: 200, nullable: true}}}}}}, responses: {'200': {description: The monitored webinar}, '404': {description: No such Academy class}, '503': {description: Academy database not connected}}}
  /api/v1/class-sessions/{sessionId}/zoom-run:
    get: {summary: "The Zoom run behind a class: Zoom's schedule (display only) beside the actual start and end, live counts and report status (staff who may open the class)", operationId: classZoomRun, tags: [Zoom], security: [{bearerAuth: []}], parameters: [{in: path, name: sessionId, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: "webinarId, topic, occurrenceUuid, state, firstSeenAt, actualStartedAt, actualEndedAt, scheduledStartAt, reported, connectedNow, people, academyClassName, classResolved"}, '204': {description: Not created by a Zoom run}, '404': {description: No such class or not visible}}}
components:
  schemas:
    AttendancePolicy:
      type: object
      required: [minConnectedPercent, lateAfterMinutes, description, version, updatedAt]
      properties:
        minConnectedPercent: {type: integer}
        lateAfterMinutes: {type: integer}
        description: {type: string}
        version: {type: integer}
        updatedAt: {type: string, format: date-time}
        autoFinalise: {type: boolean}
    ZoomIdentityDecision:
      type: object
      required: [email, reason, linkedAt]
      properties:
        email: {type: string}
        studentId: {type: string, format: uuid, nullable: true}
        studentNumber: {type: string, nullable: true}
        studentName: {type: string, nullable: true}
        reason: {type: string}
        linkedAt: {type: string, format: date-time}
    SystemStatus:
      type: object
      properties:
        service: {type: string, example: luma-api}
        status: {type: string, example: UP}
        stage: {type: string, example: BOOTSTRAP_ONLY}
        timestamp: {type: string, format: date-time}
      required: [service, status, stage, timestamp]
    AccessTokenResponse:
      type: object
      properties:
        accessToken: {type: string}
        tokenType: {type: string, example: Bearer}
        expiresIn: {type: integer, description: Seconds, example: 600}
        refreshToken: {type: string, description: Opaque single-use token}
        refreshExpiresIn: {type: integer, description: Seconds, example: 604800}
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn]
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: {type: string, maxLength: 128, writeOnly: true}
    Identity:
      type: object
      properties:
        accountId: {type: string, format: uuid}
        academyId: {type: string, format: uuid}
        roles:
          type: array
          items: {type: string, enum: [STAFF, STUDENT]}
      required: [accountId, academyId, roles]
    Course:
      type: object
      required: [id, code, title, active, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        title: {type: string}
        active: {type: boolean}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Batch:
      type: object
      required: [id, courseId, code, name, startsOn, endsOn, active, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        startsOn: {type: string, format: date}
        endsOn: {type: [string, 'null'], format: date}
        active: {type: boolean}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Student:
      type: object
      required: [id, studentNumber, fullName, accountId, active, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        studentNumber: {type: string}
        fullName: {type: string}
        email: {type: [string, 'null']}
        accountId: {type: string, format: uuid}
        accountStatus: {type: [string, 'null'], enum: [PENDING_ACTIVATION, ACTIVE, DISABLED, null]}
        active: {type: boolean}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Enrollment:
      type: object
      required: [id, batchId, courseId, batchCode, batchName, studentId, studentNumber, studentName, enrolledOn, status, version]
      properties:
        id: {type: string, format: uuid}
        batchId: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        batchCode: {type: string}
        batchName: {type: string}
        studentId: {type: string, format: uuid}
        studentNumber: {type: string}
        studentName: {type: string}
        enrolledOn: {type: string, format: date}
        withdrawnOn: {type: [string, 'null'], format: date}
        status: {type: string, enum: [ENROLLED, WITHDRAWN]}
        version: {type: integer}
    StudentClass:
      type: object
      required: [id, title, startsAt, endsAt, timeZone, localDate, status, batches]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        timeZone: {type: string, example: Asia/Colombo}
        localDate: {type: string, format: date}
        status: {type: string, enum: [SCHEDULED, CANCELLED]}
        batches:
          type: array
          description: Only the student's own batches enrolled on localDate
          items:
            type: object
            required: [batchId, code, name]
            properties:
              batchId: {type: string, format: uuid}
              code: {type: string}
              name: {type: string}
    ClassSession:
      type: object
      required: [id, title, startsAt, endsAt, timeZone, localDate, status, batches, version, createdAt, updatedAt]
      properties:
        seriesId: {type: string, format: uuid, nullable: true, description: Set on classes created together as a weekly series}
        id: {type: string, format: uuid}
        title: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        timeZone: {type: string}
        localDate: {type: string, format: date, description: Calendar date of the class in its time zone}
        status: {type: string, enum: [SCHEDULED, CANCELLED]}
        zoomWebinarId: {type: [string, 'null']}
        batches:
          type: array
          items:
            type: object
            required: [batchId, courseId, code, name]
            properties:
              batchId: {type: string, format: uuid}
              courseId: {type: string, format: uuid}
              code: {type: string}
              name: {type: string}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    StaffRole:
      type: string
      enum: [STAFF]
    StaffAccount:
      type: object
      required: [id, email, roles, status, version, createdAt]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        roles: {type: array, items: {$ref: '#/components/schemas/StaffRole'}}
        status: {type: string, enum: [PENDING_ACTIVATION, ACTIVE, DISABLED]}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
    ZoomOccurrence:
      type: object
      required: [occurrenceUuid, webinarId, firstEventAt, lastEventAt, eventCount]
      properties:
        occurrenceUuid: {type: string}
        webinarId: {type: string}
        firstEventAt: {type: string, format: date-time}
        lastEventAt: {type: string, format: date-time}
        eventCount: {type: integer}
        classSessionId: {type: [string, 'null'], format: uuid}
        linkSource: {type: [string, 'null'], enum: [AUTOMATIC, MANUAL, null]}
        linkedAt: {type: [string, 'null'], format: date-time}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
