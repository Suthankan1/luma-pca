openapi: 3.1.0
info:
  title: LUMA Physics Cube Academy Platform API
  version: 0.1.0-bootstrap
  description: |
    Endpoints without x-implementation-status are implemented and tested: system status,
    auth login/refresh/logout/logout-all/activate/me and MFA enroll/verify/reset, JWKS, courses, batches, students, enrollments, staff assignments, class sessions, staff administration, invitations, own-record routes, the Zoom webhook ingress, receipt operations and occurrence linking. Endpoints marked "planned" are proposal inventory,
    not production guarantees.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/system/status:
    get:
      summary: Bootstrap API status (implemented)
      operationId: getSystemStatus
      tags: [System]
      responses:
        '200':
          description: Service bootstrap status; not readiness of all production modules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
  /api/v1/auth/login:
    post:
      summary: Password sign-in for a session or MFA challenge (implemented)
      operationId: login
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, maxLength: 254}
                password: {type: string, maxLength: 256, writeOnly: true}
      responses:
        '200':
          description: Tokens, or an MFA challenge for accounts that need a second factor
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AccessTokenResponse'
                  - $ref: '#/components/schemas/MfaRequiredResponse'
        '400': {description: Malformed request}
        '401': {description: Invalid credentials. Identical for unknown email, wrong password, inactive and locked accounts}
  /api/v1/auth/activate:
    post:
      summary: Redeem an invitation and set the first password (implemented)
      operationId: activateAccount
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string, maxLength: 128, writeOnly: true}
                password: {type: string, maxLength: 256, writeOnly: true}
      responses:
        '204': {description: Account activated}
        '400': {description: Invitation invalid, expired, used or revoked (indistinguishable)}
        '422': {description: Password rejected by policy; the invitation stays usable}
  /api/v1/auth/me:
    get:
      summary: Current account, academy and current roles (implemented)
      operationId: getIdentity
      tags: [Identity]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401': {description: Missing, invalid, expired or revoked token}
  /.well-known/jwks.json:
    get:
      summary: Public access-token verification keys (implemented)
      operationId: getJwks
      tags: [Identity]
      responses:
        '200': {description: JWK Set containing public RSA keys only}
  /api/v1/auth/mfa/enroll:
    post:
      summary: Start authenticator enrolment for an account that needs MFA (implemented)
      operationId: enrollMfa
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaToken]
              properties:
                mfaToken: {type: string, maxLength: 128, writeOnly: true}
      responses:
        '200':
          description: Secret to load into an authenticator app; replaces any unconfirmed secret
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauthUri]
                properties:
                  secret: {type: string, description: Base32}
                  otpauthUri: {type: string}
        '400': {description: Malformed request}
        '401': {description: 'Challenge unusable, or the account already has a confirmed authenticator'}
  /api/v1/auth/mfa/verify:
    post:
      summary: Complete sign-in with an authenticator or recovery code (implemented)
      operationId: verifyMfa
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaToken, code]
              properties:
                mfaToken: {type: string, maxLength: 128, writeOnly: true}
                code: {type: string, maxLength: 32, description: 6-digit code or a recovery code}
      responses:
        '200':
          description: Tokens; recoveryCodes is set only when this call completed enrolment
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AccessTokenResponse'
                  - type: object
                    properties:
                      recoveryCodes: {type: [array, 'null'], items: {type: string}}
        '400': {description: Malformed request}
        '401': {description: Unusable challenge or rejected code (indistinguishable)}
  /api/v1/auth/mfa/reset:
    post:
      summary: Remove the caller's authenticator and end all their sessions (implemented)
      description: An enrolled account must use a live MFA-verified session.
      operationId: resetMfa
      tags: [Identity]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, maxLength: 256, writeOnly: true}
      responses:
        '204': {description: Authenticator removed; next sign-in enrols again}
        '400': {description: Malformed request}
        '401': {description: Invalid session or failed password recheck}
  /api/v1/auth/refresh:
    post:
      summary: Exchange a refresh token for a new token pair (implemented)
      description: >-
        Refresh tokens are single-use. Presenting an exchanged token revokes
        the session. An account promoted to owner or administrator must
        complete MFA before it can refresh a session.
      operationId: refreshSession
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshTokenRequest'}
      responses:
        '200':
          description: New access and refresh tokens
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessTokenResponse'}
        '400': {description: Malformed request}
        '401': {description: Unknown, expired, already used or revoked token (indistinguishable)}
  /api/v1/auth/logout:
    post:
      summary: End the session a refresh token belongs to (implemented)
      operationId: logout
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshTokenRequest'}
      responses:
        '204': {description: Always, whether or not the token was known}
        '400': {description: Malformed request}
  /api/v1/auth/logout-all:
    post:
      summary: End every session of the signed-in account (implemented)
      operationId: logoutAll
      tags: [Identity]
      security: [{bearerAuth: []}]
      responses:
        '204': {description: All sessions revoked}
        '401': {description: Missing or invalid access token}
  /api/v1/courses:
    get:
      summary: Courses of the caller's academy, sorted by code (implemented; owner/admin only)
      operationId: listCourses
      tags: [Courses]
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: active, required: false, schema: {type: boolean}}
      responses:
        '200':
          description: All matching courses
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Course'}}
        '401': {description: Not signed in}
        '403': {description: Not an academy owner or administrator}
    post:
      summary: Create a course (implemented; owner/admin only)
      operationId: createCourse
      tags: [Courses]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, title]
              properties:
                code: {type: string, maxLength: 60, description: 'Letters, digits, dot, underscore, hyphen; stored upper-case'}
                title: {type: string, maxLength: 200}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Course'}
        '400': {description: Invalid data}
        '409': {description: Code already used in this academy}
  /api/v1/courses/{courseId}:
    parameters:
      - {in: path, name: courseId, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read a course (implemented; owner/admin only)
      operationId: getCourse
      tags: [Courses]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Course
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Course'}
        '404': {description: Not found, or belongs to another academy}
    put:
      summary: Replace a course's code, title and active flag (implemented; owner/admin only)
      description: Courses are deactivated, not deleted.
      operationId: updateCourse
      tags: [Courses]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, title, active, version]
              properties:
                code: {type: string, maxLength: 60}
                title: {type: string, maxLength: 200}
                active: {type: boolean}
                version: {type: integer, description: Version last read}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Course'}
        '404': {description: Not found, or belongs to another academy}
        '409': {description: Stale version, or code already used}
  /api/v1/batches:
    get:
      summary: Batches the caller may see, newest start first (implemented; owner/admin see all, instructors and attendance officers only assigned batches)
      operationId: listBatches
      tags: [Batches]
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: courseId, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: All matching batches
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Batch'}}
        '404': {description: courseId not found in this academy}
    post:
      summary: Create a batch in a course (implemented; owner/admin only)
      operationId: createBatch
      tags: [Batches]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId, code, name, startsOn]
              properties:
                courseId: {type: string, format: uuid}
                code: {type: string, maxLength: 60}
                name: {type: string, maxLength: 200}
                startsOn: {type: string, format: date}
                endsOn: {type: [string, 'null'], format: date}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Batch'}
        '400': {description: Invalid data, including endsOn before startsOn}
        '404': {description: Course not found in this academy}
        '409': {description: Code already used in this course, or the course is inactive}
  /api/v1/batches/{batchId}:
    parameters:
      - {in: path, name: batchId, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read a batch (implemented; owner/admin, or staff assigned to it)
      operationId: getBatch
      tags: [Batches]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Batch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Batch'}
        '404': {description: Not found, or belongs to another academy}
    put:
      summary: Replace a batch's details (implemented; owner/admin only)
      description: A batch cannot be moved to another course and is deactivated, not deleted.
      operationId: updateBatch
      tags: [Batches]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, startsOn, active, version]
              properties:
                code: {type: string, maxLength: 60}
                name: {type: string, maxLength: 200}
                startsOn: {type: string, format: date}
                endsOn: {type: [string, 'null'], format: date}
                active: {type: boolean}
                version: {type: integer}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Batch'}
        '404': {description: Not found, or belongs to another academy}
        '409': {description: Stale version, or code already used}
  /api/v1/students:
    get:
      summary: Students of the caller's academy, by student number (implemented; owner/admin only)
      operationId: listStudents
      tags: [Students]
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: active, required: false, schema: {type: boolean}}
        - {in: query, name: after, required: false, schema: {type: string}, description: nextAfter from the previous page}
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextAfter]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Student'}}
                  nextAfter: {type: [string, 'null']}
        '400': {description: Invalid limit or filter}
        '403': {description: Not an academy owner or administrator}
    post:
      summary: Create a student and their pending STUDENT sign-in account (implemented; owner/admin only)
      operationId: createStudent
      tags: [Students]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentNumber, fullName, email]
              properties:
                studentNumber: {type: string, maxLength: 60, description: Academy student ID; stored upper-case; cannot change later}
                fullName: {type: string, maxLength: 200}
                email: {type: string, maxLength: 254}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Student'}
        '400': {description: Invalid data}
        '409': {description: Student number or email already used}
  /api/v1/students/{studentId}:
    parameters:
      - {in: path, name: studentId, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read a student (implemented; owner/admin only)
      operationId: getStudent
      tags: [Students]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Student
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Student'}
        '404': {description: Not found, or belongs to another academy}
    put:
      summary: Change a student's name or active flag (implemented; owner/admin only)
      operationId: updateStudent
      tags: [Students]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, active, version]
              properties:
                fullName: {type: string, maxLength: 200}
                active: {type: boolean}
                version: {type: integer}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Student'}
        '404': {description: Not found, or belongs to another academy}
        '409': {description: Stale version}
  /api/v1/students/{studentId}/enrollments:
    get:
      summary: A student's enrollments (implemented; owner/admin only)
      operationId: listStudentEnrollments
      tags: [Enrollments]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: studentId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Enrollments, withdrawn included
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Enrollment'}}
        '404': {description: Student not found in this academy}
  /api/v1/batches/{batchId}/enrollments:
    parameters:
      - {in: path, name: batchId, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Batch roster, withdrawn included, by student number (implemented; owner/admin, or staff assigned to the batch)
      operationId: listBatchEnrollments
      tags: [Enrollments]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Roster
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Enrollment'}}
        '404': {description: Batch not found in this academy}
    post:
      summary: Enrol a student in the batch (implemented; owner/admin only)
      operationId: enrollStudent
      tags: [Enrollments]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, enrolledOn]
              properties:
                studentId: {type: string, format: uuid}
                enrolledOn: {type: string, format: date}
      responses:
        '201':
          description: Enrolled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Enrollment'}
        '404': {description: Batch or student not found in this academy}
        '409': {description: Already enrolled, or batch or student inactive}
  /api/v1/enrollments/{enrollmentId}:
    put:
      summary: Change enrolment dates; a withdrawal date withdraws, clearing it re-enrols (implemented; owner/admin only)
      operationId: updateEnrollment
      tags: [Enrollments]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: enrollmentId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrolledOn, version]
              properties:
                enrolledOn: {type: string, format: date}
                withdrawnOn: {type: [string, 'null'], format: date}
                version: {type: integer}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Enrollment'}
        '400': {description: withdrawnOn before enrolledOn}
        '404': {description: Not found, or belongs to another academy}
        '409': {description: Stale version}
  /api/v1/batches/{batchId}/assignments:
    parameters:
      - {in: path, name: batchId, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Staff assigned to the batch (implemented; owner/admin only)
      operationId: listBatchAssignments
      tags: [Batches]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Assignment'}}
        '404': {description: Batch not found in this academy}
    post:
      summary: Assign an instructor or attendance officer to the batch (implemented; owner/admin only)
      operationId: assignStaff
      tags: [Batches]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: {type: string, maxLength: 254}
                role: {type: string, enum: [INSTRUCTOR, ATTENDANCE_OFFICER]}
      responses:
        '201':
          description: Assigned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Assignment'}
        '400': {description: Role is not assignable}
        '404': {description: Batch, or an account with that email, not found in this academy}
        '409': {description: Already assigned, account disabled, or account does not hold the role}
  /api/v1/assignments/{assignmentId}:
    delete:
      summary: Remove an assignment; access ends on the next request (implemented; owner/admin only)
      operationId: unassignStaff
      tags: [Batches]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: assignmentId, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Removed}
        '404': {description: Not found, or belongs to another academy}
  /api/v1/me/assignments:
    get:
      summary: The signed-in instructor's or attendance officer's own assignments (implemented)
      operationId: listMyAssignments
      tags: [Batches]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Assignments in roles the caller currently holds
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Assignment'}}
        '403': {description: Caller is not an instructor or attendance officer}
  /api/v1/staff-accounts:
    get:
      summary: Staff accounts of the caller's academy, by email; students are never listed (implemented; owner/admin)
      operationId: listStaffAccounts
      tags: [Identity]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Staff accounts
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/StaffAccount'}}
        '403': {description: Not an owner or administrator}
    post:
      summary: Create a staff account pending activation (implemented; owner/admin; only owners grant OWNER or ADMIN)
      operationId: createStaffAccount
      tags: [Identity]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, roles]
              properties:
                email: {type: string, maxLength: 254}
                roles: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/StaffRole'}}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffAccount'}
        '400': {description: Invalid email or roles (STUDENT is not a staff role)}
        '403': {description: An administrator tried to grant OWNER or ADMIN}
        '409': {description: Email already used}
  /api/v1/staff-accounts/{accountId}:
    get:
      summary: Read a staff account (implemented; owner/admin)
      operationId: getStaffAccount
      tags: [Identity]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: accountId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Staff account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffAccount'}
        '404': {description: Not a staff account of this academy}
  /api/v1/staff-accounts/{accountId}/roles:
    put:
      summary: Replace a staff account's roles; takes effect on its next request (implemented; owner/admin)
      operationId: replaceStaffRoles
      tags: [Identity]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: accountId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles, version]
              properties:
                roles: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/StaffRole'}}
                version: {type: integer}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffAccount'}
        '403': {description: 'Own account, or an administrator touching OWNER/ADMIN'}
        '404': {description: Not a staff account of this academy}
        '409': {description: 'Stale version, or it would leave no active owner'}
  /api/v1/staff-accounts/{accountId}/disable:
    post:
      summary: Disable a staff account and end all its sessions; repeating is harmless (implemented; owner/admin)
      operationId: disableStaffAccount
      tags: [Identity]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: accountId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffAccount'}
        '403': {description: 'Own account, or an administrator disabling an owner or administrator'}
        '404': {description: Not a staff account of this academy}
        '409': {description: It would leave no active owner}
  /api/v1/accounts/{accountId}/invitations:
    post:
      summary: Issue an activation invitation for a pending staff or student account (implemented; owner/admin)
      description: Replaces any earlier invitation. The token is shown once, is not stored, and is sent with Cache-Control no-store; there is no email delivery yet.
      operationId: issueInvitation
      tags: [Identity]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: accountId, required: true, schema: {type: string, format: uuid}}
      responses:
        '201':
          description: Invitation issued
          content:
            application/json:
              schema:
                type: object
                required: [accountId, activationToken, activationPath, expiresAt]
                properties:
                  accountId: {type: string, format: uuid}
                  activationToken: {type: string}
                  activationPath: {type: string, description: 'Append to the web app origin to form the invitation link, e.g. /activate#token=...'}
                  expiresAt: {type: string, format: date-time}
        '403': {description: An administrator inviting an owner or administrator}
        '404': {description: Account not in this academy}
        '409': {description: The account is not pending activation}
  /api/v1/me/student:
    get:
      summary: The signed-in student's own record (implemented; STUDENT role)
      operationId: getMyStudent
      tags: [Students]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Own record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Student'}
        '403': {description: Caller is not a student}
        '404': {description: The account has no student record}
  /api/v1/me/enrollments:
    get:
      summary: The signed-in student's own enrollments (implemented; STUDENT role)
      operationId: listMyEnrollments
      tags: [Enrollments]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Own enrollments only
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Enrollment'}}
        '403': {description: Caller is not a student}
        '404': {description: The account has no student record}
  /api/v1/class-sessions:
    get:
      summary: Sessions starting in a window, by start time (implemented; owner/admin see all, assigned staff only sessions with their batches)
      operationId: listClassSessions
      tags: [Sessions]
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: from, required: true, schema: {type: string, format: date-time}, description: Inclusive}
        - {in: query, name: to, required: true, schema: {type: string, format: date-time}, description: 'Exclusive; at most 92 days after from'}
        - {in: query, name: batchId, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ClassSession'}}
        '400': {description: Missing or invalid window}
        '404': {description: batchId not readable}
    post:
      summary: Schedule a class for one or more batches (implemented; owner/admin only)
      operationId: createClassSession
      tags: [Sessions]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startsAt, endsAt, batchIds]
              properties:
                title: {type: string, maxLength: 200}
                startsAt: {type: string, format: date-time}
                endsAt: {type: string, format: date-time, description: 'After startsAt, at most 12 hours later'}
                timeZone: {type: string, description: 'IANA region; default Asia/Colombo'}
                zoomWebinarId: {type: [string, 'null'], description: 'Zoom webinar ID; spaces and hyphens are removed'}
                batchIds: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string, format: uuid}}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassSession'}
        '400': {description: Invalid times, zone or batch list}
        '404': {description: A batch is not in this academy}
        '409': {description: A batch is inactive}
  /api/v1/class-sessions/{sessionId}:
    parameters:
      - {in: path, name: sessionId, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read a session (implemented; owner/admin, or staff assigned to one of its batches)
      operationId: getClassSession
      tags: [Sessions]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Session; batches lists only those the caller may see
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassSession'}
        '404': {description: 'Not found, other academy, or none of its batches is the caller''s'}
    put:
      summary: Replace a session, including its batch set and status (implemented; owner/admin only)
      operationId: updateClassSession
      tags: [Sessions]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startsAt, endsAt, batchIds, status, version]
              properties:
                title: {type: string, maxLength: 200}
                startsAt: {type: string, format: date-time}
                endsAt: {type: string, format: date-time}
                timeZone: {type: string}
                batchIds: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string, format: uuid}}
                status: {type: string, enum: [SCHEDULED, CANCELLED]}
                zoomWebinarId: {type: [string, 'null'], description: 'Omitting it clears it (full replacement)'}
                version: {type: integer}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassSession'}
        '404': {description: Not found, or belongs to another academy}
        '409': {description: Stale version, or an inactive batch is being added}
  /api/v1/class-sessions/{sessionId}/students:
    get:
      summary: Students expected at the class, each listed once (implemented; owner/admin, or assigned staff for their batches only)
      description: A student is expected if enrolled in one of the session's batches on the session's local date; a withdrawal date is the first day no longer enrolled.
      operationId: listExpectedStudents
      tags: [Sessions]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: sessionId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Expected students
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [studentId, studentNumber, fullName, batchIds]
                  properties:
                    studentId: {type: string, format: uuid}
                    studentNumber: {type: string}
                    fullName: {type: string}
                    batchIds: {type: array, items: {type: string, format: uuid}}
        '404': {description: Not found or not readable}
  /api/v1/zoom/receipts:
    get:
      summary: Webhook receipts by processing status, newest first, without payloads (implemented; owner/admin)
      operationId: listZoomReceipts
      tags: [Zoom]
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: status, required: false, schema: {type: string, enum: [RECEIVED, PROCESSED, DEAD], default: DEAD}}
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, eventType, eventTs, status, attempts, receivedAt, nextAttemptAt]
                  properties:
                    id: {type: string, format: uuid}
                    eventType: {type: string}
                    eventTs: {type: integer}
                    status: {type: string, enum: [RECEIVED, PROCESSED, DEAD]}
                    attempts: {type: integer}
                    lastError: {type: [string, 'null']}
                    receivedAt: {type: string, format: date-time}
                    nextAttemptAt: {type: string, format: date-time}
                    processedAt: {type: [string, 'null'], format: date-time}
        '400': {description: Invalid status or limit}
  /api/v1/zoom/receipts/{receiptId}/replay:
    post:
      summary: Requeue a dead-lettered receipt; the reason is audited (implemented; owner/admin)
      operationId: replayZoomReceipt
      tags: [Zoom]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: receiptId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 3, maxLength: 300, description: No personal data}
      responses:
        '204': {description: Requeued, due now, attempts reset}
        '400': {description: Missing or unsuitable reason}
        '404': {description: Not found in this academy}
        '409': {description: Not a dead letter}
  /api/v1/zoom/occurrences:
    get:
      summary: Zoom webinar occurrences seen in events and their class links, newest first (implemented; owner/admin)
      operationId: listZoomOccurrences
      tags: [Zoom]
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: decided, required: false, schema: {type: boolean}, description: false = waiting for review}
        - {in: query, name: sessionId, required: false, schema: {type: string, format: uuid}}
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Occurrences
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ZoomOccurrence'}}
  /api/v1/zoom/occurrence-links:
    post:
      summary: Record an administrator's decision for an occurrence; audited (implemented; owner/admin)
      description: Replaces any earlier decision. sessionId null marks the occurrence "not a class". The matcher never changes a manual decision.
      operationId: decideZoomOccurrence
      tags: [Zoom]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [occurrenceUuid, reason]
              properties:
                occurrenceUuid: {type: string, maxLength: 100}
                sessionId: {type: [string, 'null'], format: uuid}
                reason: {type: string, minLength: 3, maxLength: 300}
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ZoomOccurrence'}
        '404': {description: Occurrence or class session not found in this academy}
        '409': {description: The class session is cancelled}
  /api/v1/zoom/occurrences/auto-link:
    post:
      summary: Re-run automatic matching for undecided occurrences (implemented; owner/admin)
      operationId: autoLinkZoomOccurrences
      tags: [Zoom]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                required: [linked, stillUndecided]
                properties:
                  linked: {type: integer}
                  stillUndecided: {type: integer}
  /api/v1/class-sessions/{sessionId}/attendance:
    get:
      summary: Proposed scoped attendance — NOT IMPLEMENTED
      x-implementation-status: planned
      security: [{bearerAuth: []}]
      tags: [Attendance]
      parameters:
        - {in: path, name: sessionId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Provisional or reconciled attendance; scoped}
  /api/v1/zoom/webhooks:
    post:
      summary: Signed Zoom webhook ingress (implemented; off unless configured; verified against fixtures only)
      description: |
        No academy JWT: the Zoom signature is the credential. Requires x-zm-request-timestamp (epoch seconds,
        within 5 minutes) and x-zm-signature = "v0=" + hex HMAC-SHA256(secret token, "v0:<timestamp>:<raw body>").
        endpoint.url_validation is answered; webinar.started/ended/participant_joined/participant_left are stored
        durably before the 2xx; other verified types are acknowledged and dropped. Redeliveries of an identical body
        are acknowledged without a second receipt.
      operationId: receiveZoomWebhook
      tags: [Zoom]
      security: []
      parameters:
        - {in: header, name: x-zm-request-timestamp, required: true, schema: {type: string}}
        - {in: header, name: x-zm-signature, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [event], properties: {event: {type: string}, event_ts: {type: integer}, payload: {type: object}}}
      responses:
        '200':
          description: Stored, already stored, or ignored; for url_validation the body holds plainToken and encryptedToken
          content:
            application/json:
              schema:
                type: object
                properties:
                  plainToken: {type: string}
                  encryptedToken: {type: string}
        '400': {description: Verified but malformed (not a JSON object, no event, no event_ts, or unacceptable plainToken)}
        '401': {description: Missing, malformed, stale or mismatched signature (empty body)}
        '404': {description: Webhook ingress is not configured}
        '413': {description: Body over 64 KiB}
        '415': {description: Not application/json}
        '503': {description: Receipt could not be stored; Zoom retries 5xx}
components:
  schemas:
    SystemStatus:
      type: object
      properties:
        service: {type: string, example: luma-api}
        status: {type: string, example: UP}
        stage: {type: string, example: BOOTSTRAP_ONLY}
        timestamp: {type: string, format: date-time}
      required: [service, status, stage, timestamp]
    AccessTokenResponse:
      type: object
      properties:
        accessToken: {type: string}
        tokenType: {type: string, example: Bearer}
        expiresIn: {type: integer, description: Seconds, example: 600}
        refreshToken: {type: string, description: Opaque single-use token}
        refreshExpiresIn: {type: integer, description: Seconds, example: 604800}
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn]
    MfaRequiredResponse:
      type: object
      required: [mfaRequired, mfaToken, mfaExpiresIn, mfaEnrolled]
      properties:
        mfaRequired: {type: boolean, const: true}
        mfaToken: {type: string, description: Short-lived challenge consumed on successful verification}
        mfaExpiresIn: {type: integer, description: Seconds, example: 300}
        mfaEnrolled: {type: boolean, description: False means the client must call mfa/enroll first}
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: {type: string, maxLength: 128, writeOnly: true}
    Identity:
      type: object
      properties:
        accountId: {type: string, format: uuid}
        academyId: {type: string, format: uuid}
        roles:
          type: array
          items: {type: string, enum: [ACADEMY_OWNER, ACADEMY_ADMIN, INSTRUCTOR, ATTENDANCE_OFFICER, ANALYST, STUDENT]}
      required: [accountId, academyId, roles]
    Course:
      type: object
      required: [id, code, title, active, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        title: {type: string}
        active: {type: boolean}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Batch:
      type: object
      required: [id, courseId, code, name, startsOn, endsOn, active, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        startsOn: {type: string, format: date}
        endsOn: {type: [string, 'null'], format: date}
        active: {type: boolean}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Student:
      type: object
      required: [id, studentNumber, fullName, accountId, active, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        studentNumber: {type: string}
        fullName: {type: string}
        email: {type: [string, 'null']}
        accountId: {type: string, format: uuid}
        accountStatus: {type: [string, 'null'], enum: [PENDING_ACTIVATION, ACTIVE, DISABLED, null]}
        active: {type: boolean}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Enrollment:
      type: object
      required: [id, batchId, courseId, batchCode, batchName, studentId, studentNumber, studentName, enrolledOn, status, version]
      properties:
        id: {type: string, format: uuid}
        batchId: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        batchCode: {type: string}
        batchName: {type: string}
        studentId: {type: string, format: uuid}
        studentNumber: {type: string}
        studentName: {type: string}
        enrolledOn: {type: string, format: date}
        withdrawnOn: {type: [string, 'null'], format: date}
        status: {type: string, enum: [ENROLLED, WITHDRAWN]}
        version: {type: integer}
    Assignment:
      type: object
      required: [id, batchId, courseId, batchCode, batchName, accountId, role, createdAt]
      properties:
        id: {type: string, format: uuid}
        batchId: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        batchCode: {type: string}
        batchName: {type: string}
        accountId: {type: string, format: uuid}
        email: {type: [string, 'null']}
        role: {type: string, enum: [INSTRUCTOR, ATTENDANCE_OFFICER]}
        createdAt: {type: string, format: date-time}
    ClassSession:
      type: object
      required: [id, title, startsAt, endsAt, timeZone, localDate, status, batches, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        timeZone: {type: string}
        localDate: {type: string, format: date, description: Calendar date of the class in its time zone}
        status: {type: string, enum: [SCHEDULED, CANCELLED]}
        zoomWebinarId: {type: [string, 'null']}
        batches:
          type: array
          items:
            type: object
            required: [batchId, courseId, code, name]
            properties:
              batchId: {type: string, format: uuid}
              courseId: {type: string, format: uuid}
              code: {type: string}
              name: {type: string}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    StaffRole:
      type: string
      enum: [ACADEMY_OWNER, ACADEMY_ADMIN, INSTRUCTOR, ATTENDANCE_OFFICER, ANALYST]
    StaffAccount:
      type: object
      required: [id, email, roles, status, mfaEnrolled, version, createdAt]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        roles: {type: array, items: {$ref: '#/components/schemas/StaffRole'}}
        status: {type: string, enum: [PENDING_ACTIVATION, ACTIVE, DISABLED]}
        mfaEnrolled: {type: boolean}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
    ZoomOccurrence:
      type: object
      required: [occurrenceUuid, webinarId, firstEventAt, lastEventAt, eventCount]
      properties:
        occurrenceUuid: {type: string}
        webinarId: {type: string}
        firstEventAt: {type: string, format: date-time}
        lastEventAt: {type: string, format: date-time}
        eventCount: {type: integer}
        classSessionId: {type: [string, 'null'], format: uuid}
        linkSource: {type: [string, 'null'], enum: [AUTOMATIC, MANUAL, null]}
        linkedAt: {type: [string, 'null'], format: date-time}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
