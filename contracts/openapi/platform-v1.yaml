    post:
      summary: Finalise a class's attendance by the academy's rule (implemented, 004B; staff; audited ATTENDANCE_FINALISED)
      description: |
        Only when a rule is recorded, the class is scheduled and over, and every linked occurrence is counted from Zoom's
        participant report (RECONCILED). One record per expected student (PRESENT, LATE or ABSENT), with the facts and the
