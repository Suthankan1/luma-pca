openapi: 3.1.0
info:
  title: LUMA Physics Cube Academy Platform API
  version: 0.1.0-bootstrap
  description: |
    Endpoints without x-implementation-status are implemented and tested: system status,
    auth login/refresh/logout/logout-all/activate/me and MFA enroll/verify/reset, JWKS, courses, batches, students, enrollments, staff assignments, class sessions, staff administration, invitations, own-record routes, the Zoom webhook ingress, receipt operations and occurrence linking. Endpoints marked "planned" are proposal inventory,
    not production guarantees.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/system/status:
    get:
      summary: Bootstrap API status (implemented)
      operationId: getSystemStatus
      tags: [System]
      responses:
        '200':
          description: Service bootstrap status; not readiness of all production modules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
  /api/v1/auth/login:
    post:
      summary: Password sign-in for a session or MFA challenge (implemented)
      operationId: login
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, maxLength: 254}
                password: {type: string, maxLength: 256, writeOnly: true}
      responses:
        '200':
          description: Tokens, or an MFA challenge for accounts that need a second factor
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AccessTokenResponse'
                  - $ref: '#/components/schemas/MfaRequiredResponse'
        '400': {description: Malformed request}
        '401': {description: Invalid credentials. Identical for unknown email, wrong password, inactive and locked accounts}
        '429': {description: Too many attempts from this client (per-visitor limit); see the Retry-After header}
  /api/v1/auth/activate:
    post:
      summary: Redeem an invitation and set the first password (implemented)
      operationId: activateAccount
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string, maxLength: 128, writeOnly: true}
                password: {type: string, maxLength: 256, writeOnly: true}
      responses:
        '204': {description: Account activated}
        '400': {description: Invitation invalid, expired, used or revoked (indistinguishable)}
        '422': {description: Password rejected by policy; the invitation stays usable}
        '429': {description: Too many attempts from this client (per-visitor limit); see the Retry-After header}
  /api/v1/auth/password-reset/request:
    post:
      summary: Email a password reset link to an active account (implemented; off unless luma.mail is enabled)
      description: >
        The answer is the same whether or not the address has an account. Only active accounts get an
        email; at most luma.password-reset.max-requests-per-hour (default 3) per account per hour, and a
        new request revokes the earlier link. The link is <web-origin>/reset-password#token=<token>.
      operationId: requestPasswordReset
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, maxLength: 254}
      responses:
        '202': {description: Accepted; an email is sent if the address belongs to an active account}
        '400': {description: Missing or over-long email}
        '503': {description: Password reset by email is not configured}
        '429': {description: Too many attempts from this client (per-visitor limit); see the Retry-After header}
  /api/v1/auth/password-reset/confirm:
    post:
      summary: Set a new password with an emailed reset token (implemented)
      description: Ends every session of the account and clears a lockout. MFA is unchanged.
      operationId: confirmPasswordReset
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string, maxLength: 128, writeOnly: true}
                password: {type: string, maxLength: 256, writeOnly: true}
      responses:
        '204': {description: Password changed}
        '400': {description: Link invalid, expired, used or revoked, or the account is no longer active (indistinguishable)}
        '422': {description: Password rejected by policy; the link stays usable}
        '429': {description: Too many attempts from this client (per-visitor limit); see the Retry-After header}
  /api/v1/auth/me:
    get:
      summary: Current account, academy and current roles (implemented)
      operationId: getIdentity
      tags: [Identity]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401': {description: Missing, invalid, expired or revoked token}
  /.well-known/jwks.json:
    get:
      summary: Public access-token verification keys (implemented)
      operationId: getJwks
      tags: [Identity]
      responses:
        '200': {description: JWK Set containing public RSA keys only}
  /api/v1/auth/mfa/enroll:
    post:
      summary: Start authenticator enrolment for an account that needs MFA (implemented)
      operationId: enrollMfa
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaToken]
              properties:
                mfaToken: {type: string, maxLength: 128, writeOnly: true}
      responses:
        '200':
          description: Secret to load into an authenticator app; replaces any unconfirmed secret
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauthUri]
                properties:
                  secret: {type: string, description: Base32}
                  otpauthUri: {type: string}
        '400': {description: Malformed request}
        '401': {description: 'Challenge unusable, or the account already has a confirmed authenticator'}
        '429': {description: Too many attempts from this client (per-visitor limit); see the Retry-After header}
  /api/v1/auth/mfa/verify:
    post:
      summary: Complete sign-in with an authenticator or recovery code (implemented)
      operationId: verifyMfa
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaToken, code]
              properties:
                mfaToken: {type: string, maxLength: 128, writeOnly: true}
                code: {type: string, maxLength: 32, description: 6-digit code or a recovery code}
      responses:
        '200':
          description: Tokens; recoveryCodes is set only when this call completed enrolment
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AccessTokenResponse'
                  - type: object
                    properties:
                      recoveryCodes: {type: [array, 'null'], items: {type: string}}
        '400': {description: Malformed request}
        '401': {description: Unusable challenge or rejected code (indistinguishable)}
        '429': {description: Too many attempts from this client (per-visitor limit); see the Retry-After header}
  /api/v1/auth/mfa/reset:
    post:
      summary: Remove the caller's authenticator and end all their sessions (implemented)
      description: An enrolled account must use a live MFA-verified session.
      operationId: resetMfa
      tags: [Identity]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, maxLength: 256, writeOnly: true}
      responses:
        '204': {description: Authenticator removed; next sign-in enrols again}
        '400': {description: Malformed request}
        '401': {description: Invalid session or failed password recheck}
  /api/v1/auth/refresh:
    post:
      summary: Exchange a refresh token for a new token pair (implemented)
      description: >-
        Refresh tokens are single-use. Presenting an exchanged token revokes
        the session. An account promoted to owner or administrator must
        complete MFA before it can refresh a session.
      operationId: refreshSession
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshTokenRequest'}
      responses:
        '200':
          description: New access and refresh tokens
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessTokenResponse'}
        '400': {description: Malformed request}
        '401': {description: Unknown, expired, already used or revoked token (indistinguishable)}
  /api/v1/auth/logout:
    post:
      summary: End the session a refresh token belongs to (implemented)
      operationId: logout
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshTokenRequest'}
      responses:
        '204': {description: Always, whether or not the token was known}
        '400': {description: Malformed request}
  /api/v1/auth/logout-all:
    post:
      summary: End every session of the signed-in account (implemented)
      operationId: logoutAll
      tags: [Identity]
      security: [{bearerAuth: []}]
      responses:
        '204': {description: All sessions revoked}
        '401': {description: Missing or invalid access token}
  /api/v1/courses:
    get:
      summary: Courses of the caller's academy, sorted by code (implemented; owner/admin only)
      operationId: listCourses
      tags: [Courses]
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: active, required: false, schema: {type: boolean}}
      responses:
        '200':
          description: All matching courses
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Course'}}
        '401': {description: Not signed in}
        '403': {description: Not an academy owner or administrator}
    post:
      summary: Create a course (implemented; owner/admin only)
      operationId: createCourse
      tags: [Courses]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, title]
              properties:
                code: {type: string, maxLength: 60, description: 'Letters, digits, dot, underscore, hyphen; stored upper-case'}
                title: {type: string, maxLength: 200}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Course'}
        '400': {description: Invalid data}
        '409': {description: Code already used in this academy}
  /api/v1/courses/{courseId}:
    parameters:
      - {in: path, name: courseId, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read a course (implemented; owner/admin only)
      operationId: getCourse
      tags: [Courses]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Course
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Course'}
        '404': {description: Not found, or belongs to another academy}
    put:
      summary: Replace a course's code, title and active flag (implemented; owner/admin only)
      description: Courses are deactivated, not deleted.
      operationId: updateCourse
      tags: [Courses]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, title, active, version]
              properties:
                code: {type: string, maxLength: 60}
                title: {type: string, maxLength: 200}
                active: {type: boolean}
                version: {type: integer, description: Version last read}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Course'}
        '404': {description: Not found, or belongs to another academy}
        '409': {description: Stale version, or code already used}
  /api/v1/batches:
    get:
      summary: Batches the caller may see, newest start first (implemented; owner/admin see all, instructors and attendance officers only assigned batches)
      operationId: listBatches
      tags: [Batches]
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: courseId, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: All matching batches
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Batch'}}
        '404': {description: courseId not found in this academy}
    post:
      summary: Create a batch in a course (implemented; owner/admin only)
      operationId: createBatch
      tags: [Batches]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId, code, name, startsOn]
              properties:
                courseId: {type: string, format: uuid}
                code: {type: string, maxLength: 60}
                name: {type: string, maxLength: 200}
                startsOn: {type: string, format: date}
                endsOn: {type: [string, 'null'], format: date}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Batch'}
        '400': {description: Invalid data, including endsOn before startsOn}
        '404': {description: Course not found in this academy}
        '409': {description: Code already used in this course, or the course is inactive}
  /api/v1/batches/{batchId}:
    parameters:
      - {in: path, name: batchId, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read a batch (implemented; owner/admin, or staff assigned to it)
      operationId: getBatch
      tags: [Batches]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Batch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Batch'}
        '404': {description: Not found, or belongs to another academy}
    put:
      summary: Replace a batch's details (implemented; owner/admin only)
      description: A batch cannot be moved to another course and is deactivated, not deleted.
      operationId: updateBatch
      tags: [Batches]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, startsOn, active, version]
              properties:
                code: {type: string, maxLength: 60}
                name: {type: string, maxLength: 200}
                startsOn: {type: string, format: date}
                endsOn: {type: [string, 'null'], format: date}
                active: {type: boolean}
                version: {type: integer}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Batch'}
        '404': {description: Not found, or belongs to another academy}
        '409': {description: Stale version, or code already used}
  /api/v1/students:
    get:
      summary: Students of the caller's academy, by student number (implemented; owner/admin only)
      operationId: listStudents
      tags: [Students]
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: q, required: false, schema: {type: string, maxLength: 100}, description: 'Part of a student number or full name (any letter case; % and _ literal), or a whole email address'}
        - {in: query, name: active, required: false, schema: {type: boolean}}
        - {in: query, name: after, required: false, schema: {type: string}, description: nextAfter from the previous page}
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextAfter]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Student'}}
                  nextAfter: {type: [string, 'null']}
        '400': {description: Invalid limit or filter}
        '403': {description: Not an academy owner or administrator}
    post:
      summary: Create a student and their pending STUDENT sign-in account (implemented; owner/admin only)
      operationId: createStudent
      tags: [Students]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentNumber, fullName, email]
              properties:
                studentNumber: {type: string, maxLength: 60, description: Academy student ID; stored upper-case; cannot change later}
                fullName: {type: string, maxLength: 200}
                email: {type: string, maxLength: 254}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Student'}
        '400': {description: Invalid data}
        '409': {description: Student number or email already used}
  /api/v1/students/{studentId}:
    parameters:
      - {in: path, name: studentId, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read a student (implemented; owner/admin only)
      operationId: getStudent
      tags: [Students]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Student
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Student'}
        '404': {description: Not found, or belongs to another academy}
    put:
      summary: Change a student's name or active flag (implemented; owner/admin only)
      operationId: updateStudent
      tags: [Students]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, active, version]
              properties:
                fullName: {type: string, maxLength: 200}
                active: {type: boolean}
                version: {type: integer}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Student'}
        '404': {description: Not found, or belongs to another academy}
        '409': {description: Stale version}
  /api/v1/students/{studentId}/enrollments:
    get:
      summary: A student's enrollments (implemented; owner/admin only)
      operationId: listStudentEnrollments
      tags: [Enrollments]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: studentId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Enrollments, withdrawn included
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Enrollment'}}
        '404': {description: Student not found in this academy}
  /api/v1/batches/{batchId}/enrollments:
    parameters:
      - {in: path, name: batchId, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Batch roster, withdrawn included, by student number (implemented; owner/admin, or staff assigned to the batch)
      operationId: listBatchEnrollments
      tags: [Enrollments]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Roster
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Enrollment'}}
        '404': {description: Batch not found in this academy}
    post:
      summary: Enrol a student in the batch (implemented; owner/admin only)
      operationId: enrollStudent
      tags: [Enrollments]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, enrolledOn]
              properties:
                studentId: {type: string, format: uuid}
                enrolledOn: {type: string, format: date}
      responses:
        '201':
          description: Enrolled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Enrollment'}
        '404': {description: Batch or student not found in this academy}
        '409': {description: Already enrolled, or batch or student inactive}
  /api/v1/enrollments/{enrollmentId}:
    put:
      summary: Change enrolment dates; a withdrawal date withdraws, clearing it re-enrols (implemented; owner/admin only)
      operationId: updateEnrollment
      tags: [Enrollments]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: enrollmentId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrolledOn, version]
              properties:
                enrolledOn: {type: string, format: date}
                withdrawnOn: {type: [string, 'null'], format: date}
                version: {type: integer}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Enrollment'}
        '400': {description: withdrawnOn before enrolledOn}
        '404': {description: Not found, or belongs to another academy}
        '409': {description: Stale version}
  /api/v1/batches/{batchId}/assignments:
    parameters:
      - {in: path, name: batchId, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Staff assigned to the batch (implemented; owner/admin only)
      operationId: listBatchAssignments
      tags: [Batches]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Assignment'}}
        '404': {description: Batch not found in this academy}
    post:
      summary: Assign an instructor or attendance officer to the batch (implemented; owner/admin only)
      operationId: assignStaff
      tags: [Batches]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: {type: string, maxLength: 254}
                role: {type: string, enum: [INSTRUCTOR, ATTENDANCE_OFFICER]}
      responses:
        '201':
          description: Assigned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Assignment'}
        '400': {description: Role is not assignable}
        '404': {description: Batch, or an account with that email, not found in this academy}
        '409': {description: Already assigned, account disabled, or account does not hold the role}
  /api/v1/assignments/{assignmentId}:
    delete:
      summary: Remove an assignment; access ends on the next request (implemented; owner/admin only)
      operationId: unassignStaff
      tags: [Batches]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: assignmentId, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Removed}
        '404': {description: Not found, or belongs to another academy}
  /api/v1/me/assignments:
    get:
      summary: The signed-in instructor's or attendance officer's own assignments (implemented)
      operationId: listMyAssignments
      tags: [Batches]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Assignments in roles the caller currently holds
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Assignment'}}
        '403': {description: Caller is not an instructor or attendance officer}
  /api/v1/staff-accounts:
    get:
      summary: Staff accounts of the caller's academy, by email; students are never listed (implemented; owner/admin)
      operationId: listStaffAccounts
      tags: [Identity]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Staff accounts
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/StaffAccount'}}
        '403': {description: Not an owner or administrator}
    post:
      summary: Create a staff account pending activation (implemented; owner/admin; only owners grant OWNER or ADMIN)
      operationId: createStaffAccount
      tags: [Identity]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, roles]
              properties:
                email: {type: string, maxLength: 254}
                roles: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/StaffRole'}}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffAccount'}
        '400': {description: Invalid email or roles (STUDENT is not a staff role)}
        '403': {description: An administrator tried to grant OWNER or ADMIN}
        '409': {description: Email already used}
  /api/v1/staff-accounts/{accountId}:
    get:
      summary: Read a staff account (implemented; owner/admin)
      operationId: getStaffAccount
      tags: [Identity]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: accountId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Staff account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffAccount'}
        '404': {description: Not a staff account of this academy}
  /api/v1/staff-accounts/{accountId}/roles:
    put:
      summary: Replace a staff account's roles; takes effect on its next request (implemented; owner/admin)
      operationId: replaceStaffRoles
      tags: [Identity]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: accountId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles, version]
              properties:
                roles: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/StaffRole'}}
                version: {type: integer}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffAccount'}
        '403': {description: 'Own account, or an administrator touching OWNER/ADMIN'}
        '404': {description: Not a staff account of this academy}
        '409': {description: 'Stale version, or it would leave no active owner'}
  /api/v1/staff-accounts/{accountId}/enable:
    post:
      summary: Re-enable a disabled staff account (implemented; owner/admin, only an owner for owner or administrator accounts)
      description: >-
        The account becomes ACTIVE with its existing password (and two-step sign-in, if
        enrolled), or PENDING_ACTIVATION when requireNewPassword is true or it never had a
        password; then the old password is removed and any open invitation revoked, so an
        invitation is needed. Sessions and tokens ended by the disable stay invalid; lockout is
        cleared. Enabling an account that is not disabled changes nothing. Audited.
      operationId: enableStaffAccount
      tags: [Staff]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: accountId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                requireNewPassword: {type: boolean, default: false}
      responses:
        '200': {description: The account as it is now}
        '403': {description: Caller may not manage this account}
        '404': {description: No such staff account in the caller's academy (students are not staff accounts)}
  /api/v1/staff-accounts/{accountId}/disable:
    post:
      summary: Disable a staff account and end all its sessions; repeating is harmless (implemented; owner/admin)
      operationId: disableStaffAccount
      tags: [Identity]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: accountId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffAccount'}
        '403': {description: 'Own account, or an administrator disabling an owner or administrator'}
        '404': {description: Not a staff account of this academy}
        '409': {description: It would leave no active owner}
  /api/v1/accounts/{accountId}/invitations:
    post:
      summary: Issue an activation invitation for a pending staff or student account (implemented; owner/admin)
      description: >
        Replaces any earlier invitation. With delivery LINK (the default, also with no body) the token
        is returned once, is not stored, and is sent with Cache-Control no-store. With delivery EMAIL
        the link (<luma.mail.web-origin>/activate#token=...) is emailed to the account's address after
        the change commits and is not returned. The audit record notes the delivery method.
      operationId: issueInvitation
      tags: [Identity]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: accountId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                delivery: {type: string, enum: [LINK, EMAIL], default: LINK}
      responses:
        '201':
          description: Invitation issued
          content:
            application/json:
              schema:
                type: object
                required: [accountId, expiresAt, delivery]
                properties:
                  accountId: {type: string, format: uuid}
                  activationToken: {type: string, nullable: true, description: Null when emailed}
                  activationPath: {type: string, nullable: true, description: 'Append to the web app origin to form the invitation link, e.g. /activate#token=...; null when emailed'}
                  expiresAt: {type: string, format: date-time}
                  delivery: {type: string, enum: [LINK, EMAIL]}
        '400': {description: Unknown delivery method}
        '403': {description: An administrator inviting an owner or administrator}
        '404': {description: Account not in this academy}
        '409': {description: The account is not pending activation}
        '503': {description: delivery EMAIL while email is not configured; nothing was changed}
  /api/v1/me/student:
    get:
      summary: The signed-in student's own record (implemented; STUDENT role)
      operationId: getMyStudent
      tags: [Students]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Own record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Student'}
        '403': {description: Caller is not a student}
        '404': {description: The account has no student record}
  /api/v1/students/import:
    post:
      summary: Create many students at once, optionally enrolling them all in one batch (implemented; owner/admin)
      description: >-
        Every row is checked first (format, repeats within the request, student numbers already
        used in the academy, emails already used by any account). If any row has a problem,
        nothing is written and every problem is returned with 200 and imported=false. A dry run
        only checks. Accounts are created pending activation; no invitations are sent. The audit
        trail records counts and the batch only.
      operationId: importStudents
      tags: [Students]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    properties:
                      studentNumber: {type: string}
                      fullName: {type: string}
                      email: {type: string}
                batchId: {type: string, format: uuid, description: 'Optional; requires enrolledOn'}
                enrolledOn: {type: string, format: date, description: 'Required with batchId'}
                dryRun: {type: boolean, default: false, description: 'Optional since STU-3; omitted means false'}
      responses:
        '200':
          description: The check or import result
          content:
            application/json:
              schema:
                type: object
                required: [imported, rows, enrolled, problems]
                properties:
                  imported: {type: boolean, description: 'True only when the students were created'}
                  rows: {type: integer}
                  enrolled: {type: integer}
                  problems:
                    type: array
                    items:
                      type: object
                      required: [row, field, message]
                      properties:
                        row: {type: integer, description: 1-based position in rows}
                        field: {type: string, enum: [studentNumber, fullName, email]}
                        message: {type: string}
        '400': {description: No rows, more than 1000, or batchId and enrolledOn not given together}
        '403': {description: Caller is not an academy owner or administrator}
        '404': {description: The batch is not in the caller's academy}
        '409': {description: The batch is inactive, or a number or email was taken by a concurrent change}
  /api/v1/student-invitations:
    post:
      summary: Queue activation invitation emails for many students (implemented; owner/admin)
      description: >-
        Covers the active students currently enrolled in batchId (not withdrawn as of today in
        Asia/Colombo), or every active student of the academy when batchId is absent. Only
        student accounts still pending activation are counted. Unless resend is true, accounts
        holding a usable invitation are skipped (except when their last queued email failed).
        Emails are sent in the background, at least once, each with a newly issued link that
        replaces any earlier one; an account activated meanwhile is not emailed. dryRun counts
        without queueing. 503 when email is not set up.
      operationId: queueStudentInvitations
      tags: [Students]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                batchId: {type: string, format: uuid}
                resend: {type: boolean, default: false}
                dryRun: {type: boolean, default: false}
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                required: [pending, queued, alreadyQueued, alreadyInvited]
                properties:
                  pending: {type: integer, description: Covered student accounts still pending activation}
                  queued: {type: integer, description: 'Queued now (dry run: would be queued)'}
                  alreadyQueued: {type: integer}
                  alreadyInvited: {type: integer, description: Skipped because they hold a usable link (resend false)}
        '403': {description: Caller is not an academy owner or administrator}
        '404': {description: The batch is not in the caller's academy}
        '503': {description: Email is not set up}
  /api/v1/student-invitations/failures:
    get:
      summary: Students whose latest invitation email failed in the last 14 days and who still have not activated (implemented; owner/admin)
      operationId: studentInvitationFailures
      tags: [Students]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Newest first, at most 200; a student leaves the list once emailed again or activated
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    studentId: {type: string, format: uuid}
                    studentNumber: {type: string}
                    fullName: {type: string}
                    email: {type: string}
                    reason: {type: string, description: The kind of failure (exception class), never the mail server's message}
                    failedAt: {type: string, format: date-time}
                    attempts: {type: integer}
        '403': {description: Caller is not an academy owner or administrator}
  /api/v1/student-invitations/progress:
    get:
      summary: Invitation emails of the academy waiting now, and sent, failed or cancelled in the last 14 days (implemented; owner/admin)
      operationId: studentInvitationProgress
      tags: [Students]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                required: [waiting, sent, failed, cancelled]
                properties:
                  waiting: {type: integer}
                  sent: {type: integer}
                  failed: {type: integer}
                  cancelled: {type: integer}
        '403': {description: Caller is not an academy owner or administrator}
  /api/v1/audit-events:
    get:
      summary: The academy's activity log, newest first (implemented; owner/admin, read-only)
      description: >-
        Audited actions with the acting account's email and a readable target label (an
        account's email, a batch code or a class title) where those still exist. Details never
        hold passwords, tokens or student personal data. The log is append-only in the database.
      operationId: listAuditEvents
      tags: [Audit]
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: category, required: false, schema: {type: string, enum: [staff, sign-in, students, classes, zoom]}}
        - {in: query, name: targetId, required: false, schema: {type: string, format: uuid}, description: One record's history}
        - {in: query, name: before, required: false, schema: {type: string}, description: nextBefore from the previous page}
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: One page of events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  nextBefore: {type: string, nullable: true}
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, occurredAt, action, targetType, details]
                      properties:
                        id: {type: string, format: uuid}
                        occurredAt: {type: string, format: date-time}
                        action: {type: string, example: STAFF_ACCOUNT_DISABLED}
                        actorAccountId: {type: string, format: uuid, nullable: true}
                        actorEmail: {type: string, nullable: true}
                        targetType: {type: string}
                        targetId: {type: string, format: uuid, nullable: true}
                        targetLabel: {type: string, nullable: true}
                        details: {type: object, additionalProperties: true}
        '400': {description: Unknown category, bad cursor or limit}
        '403': {description: Caller is not an academy owner or administrator}
  /api/v1/me/enrollments:
    get:
      summary: The signed-in student's own enrollments (implemented; STUDENT role)
      operationId: listMyEnrollments
      tags: [Enrollments]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Own enrollments only
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Enrollment'}}
        '403': {description: Caller is not a student}
        '404': {description: The account has no student record}
  /api/v1/me/class-sessions:
    get:
      summary: The signed-in student's own classes starting in a window, by start time (implemented; STUDENT role)
      description: >-
        A class is listed when the student is enrolled, on the class's local date, in at least one
        of its batches; only those batches are listed. Cancelled classes are included. The Zoom
        webinar ID is not exposed to students.
      operationId: listMyClassSessions
      tags: [Sessions]
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: from, required: true, schema: {type: string, format: date-time}, description: Inclusive}
        - {in: query, name: to, required: true, schema: {type: string, format: date-time}, description: 'Exclusive; at most 92 days after from'}
      responses:
        '200':
          description: Own classes only (empty when not enrolled)
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/StudentClass'}}
        '400': {description: Window invalid or longer than 92 days}
        '403': {description: Caller is not a student}
  /api/v1/class-sessions/series:
    post:
      summary: Create a weekly series of classes, or preview it (implemented; owner/admin)
      description: >-
        One class on each chosen weekday from firstDate to lastDate (inclusive, at most 366 days
        apart), at startTime–endTime local time in timeZone (default Asia/Colombo; times follow
        daylight-saving changes), leaving out skipDates; 1 to 100 classes. Every class is an
        ordinary class session sharing seriesId. A class that would overlap a scheduled class of
        any of the same batches is returned in conflicts and nothing is created. dryRun previews.
      operationId: createClassSeries
      tags: [Sessions]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, firstDate, lastDate, weekdays, startTime, endTime, batchIds]
              properties:
                title: {type: string, maxLength: 200}
                firstDate: {type: string, format: date}
                lastDate: {type: string, format: date}
                weekdays: {type: array, minItems: 1, maxItems: 7, items: {type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]}}
                startTime: {type: string, example: '18:00'}
                endTime: {type: string, example: '20:00', description: Same day, after startTime}
                timeZone: {type: string, example: Asia/Colombo}
                batchIds: {type: array, minItems: 1, maxItems: 20, items: {type: string, format: uuid}}
                zoomWebinarId: {type: string}
                skipDates: {type: array, maxItems: 100, items: {type: string, format: date}}
                dryRun: {type: boolean, default: false}
      responses:
        '200':
          description: The planned or created classes, and any overlaps
          content:
            application/json:
              schema:
                type: object
                required: [created, occurrences, conflicts]
                properties:
                  created: {type: boolean}
                  seriesId: {type: string, format: uuid, nullable: true}
                  occurrences:
                    type: array
                    items:
                      type: object
                      properties:
                        localDate: {type: string, format: date}
                        startsAt: {type: string, format: date-time}
                        endsAt: {type: string, format: date-time}
                        id: {type: string, format: uuid, nullable: true}
                  conflicts:
                    type: array
                    items:
                      type: object
                      properties:
                        localDate: {type: string, format: date}
                        sessionId: {type: string, format: uuid}
                        title: {type: string}
                        startsAt: {type: string, format: date-time}
                        endsAt: {type: string, format: date-time}
        '400': {description: Invalid dates, times, weekdays, webinar ID, or not 1–100 classes}
        '403': {description: Caller is not an academy owner or administrator}
        '404': {description: A batch is not in the caller's academy}
        '409': {description: A batch is inactive}
  /api/v1/class-sessions/series/{seriesId}/changes:
    post:
      summary: Change the title, time or webinar of a series' scheduled classes from a date, or preview it (implemented; owner/admin)
      description: >-
        Applies to the series' SCHEDULED classes whose local date is on or after fromDate. Omitted fields
        are kept; startTime and endTime go together and are applied in each class's own zone;
        clearWebinar removes the webinar ID. If a class would then overlap a scheduled class of the same
        batches outside the change, the conflicts are returned and nothing changes. Zoom links are
        re-checked per class; one CLASS_SERIES_UPDATED audit event is recorded.
      operationId: editClassSeries
      tags: [Sessions]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: seriesId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromDate]
              properties:
                fromDate: {type: string, format: date}
                title: {type: string, maxLength: 200}
                startTime: {type: string, example: '17:30'}
                endTime: {type: string, example: '19:30'}
                zoomWebinarId: {type: string}
                clearWebinar: {type: boolean, default: false}
                dryRun: {type: boolean, default: false}
      responses:
        '200':
          description: The classes as they would be (or now are), and any overlaps
          content:
            application/json:
              schema:
                type: object
                required: [applied, occurrences, conflicts]
                properties:
                  applied: {type: boolean}
                  occurrences: {type: array, items: {type: object}}
                  conflicts: {type: array, items: {type: object}}
        '400': {description: Nothing to change, invalid times or webinar, or no scheduled classes from that date}
        '403': {description: Caller is not an academy owner or administrator}
        '404': {description: No such series in the caller's academy}
  /api/v1/class-sessions/series/{seriesId}/cancellations:
    post:
      summary: Cancel the series' scheduled classes on or after a date (implemented; owner/admin)
      operationId: cancelClassSeries
      tags: [Sessions]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: seriesId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromDate]
              properties:
                fromDate: {type: string, format: date, description: Compared with each class's local date}
      responses:
        '200':
          description: How many classes were cancelled
          content:
            application/json:
              schema: {type: object, required: [cancelled], properties: {cancelled: {type: integer}}}
        '403': {description: Caller is not an academy owner or administrator}
        '404': {description: No such series in the caller's academy}
  /api/v1/class-sessions:
    get:
      summary: Sessions starting in a window, by start time (implemented; owner/admin see all, assigned staff only sessions with their batches)
      operationId: listClassSessions
      tags: [Sessions]
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: from, required: true, schema: {type: string, format: date-time}, description: Inclusive}
        - {in: query, name: to, required: true, schema: {type: string, format: date-time}, description: 'Exclusive; at most 92 days after from'}
        - {in: query, name: batchId, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ClassSession'}}
        '400': {description: Missing or invalid window}
        '404': {description: batchId not readable}
    post:
      summary: Schedule a class for one or more batches (implemented; owner/admin only)
      operationId: createClassSession
      tags: [Sessions]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startsAt, endsAt, batchIds]
              properties:
                title: {type: string, maxLength: 200}
                startsAt: {type: string, format: date-time}
                endsAt: {type: string, format: date-time, description: 'After startsAt, at most 12 hours later'}
                timeZone: {type: string, description: 'IANA region; default Asia/Colombo'}
                zoomWebinarId: {type: [string, 'null'], description: 'Zoom webinar ID; spaces and hyphens are removed'}
                batchIds: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string, format: uuid}}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassSession'}
        '400': {description: Invalid times, zone or batch list}
        '404': {description: A batch is not in this academy}
        '409': {description: A batch is inactive}
  /api/v1/class-sessions/{sessionId}:
    parameters:
      - {in: path, name: sessionId, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read a session (implemented; owner/admin, or staff assigned to one of its batches)
      operationId: getClassSession
      tags: [Sessions]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Session; batches lists only those the caller may see
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassSession'}
        '404': {description: 'Not found, other academy, or none of its batches is the caller''s'}
    put:
      summary: Replace a session, including its batch set and status (implemented; owner/admin only)
      operationId: updateClassSession
      description: >-
        In the same transaction, automatic Zoom occurrence links near the class's old and new
        webinar and time are re-checked: kept only while exactly this class still fits, otherwise
        moved to the one class that fits or returned to review; undecided occurrences nearby are
        matched. Manual decisions are never changed. Creating classes (single or series) and
        cancelling the rest of a series do the same.
      tags: [Sessions]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startsAt, endsAt, batchIds, status, version]
              properties:
                title: {type: string, maxLength: 200}
                startsAt: {type: string, format: date-time}
                endsAt: {type: string, format: date-time}
                timeZone: {type: string}
                batchIds: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string, format: uuid}}
                status: {type: string, enum: [SCHEDULED, CANCELLED]}
                zoomWebinarId: {type: [string, 'null'], description: 'Omitting it clears it (full replacement)'}
                version: {type: integer}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassSession'}
        '404': {description: Not found, or belongs to another academy}
        '409': {description: Stale version, or an inactive batch is being added}
  /api/v1/class-sessions/{sessionId}/students:
    get:
      summary: Students expected at the class, each listed once (implemented; owner/admin, or assigned staff for their batches only)
      description: A student is expected if enrolled in one of the session's batches on the session's local date; a withdrawal date is the first day no longer enrolled.
      operationId: listExpectedStudents
      tags: [Sessions]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: sessionId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Expected students
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [studentId, studentNumber, fullName, batchIds]
                  properties:
                    studentId: {type: string, format: uuid}
                    studentNumber: {type: string}
                    fullName: {type: string}
                    batchIds: {type: array, items: {type: string, format: uuid}}
        '404': {description: Not found or not readable}
  /api/v1/zoom/receipts:
    get:
      summary: Webhook receipts by processing status, newest first, without payloads (implemented; owner/admin)
      operationId: listZoomReceipts
      tags: [Zoom]
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: status, required: false, schema: {type: string, enum: [RECEIVED, PROCESSED, DEAD], default: DEAD}}
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, eventType, eventTs, status, attempts, receivedAt, nextAttemptAt]
                  properties:
                    id: {type: string, format: uuid}
                    eventType: {type: string}
                    eventTs: {type: integer}
                    status: {type: string, enum: [RECEIVED, PROCESSED, DEAD]}
                    attempts: {type: integer}
                    lastError: {type: [string, 'null']}
                    receivedAt: {type: string, format: date-time}
                    nextAttemptAt: {type: string, format: date-time}
                    processedAt: {type: [string, 'null'], format: date-time}
        '400': {description: Invalid status or limit}
  /api/v1/zoom/receipts/{receiptId}/replay:
    post:
      summary: Requeue a dead-lettered receipt; the reason is audited (implemented; owner/admin)
      operationId: replayZoomReceipt
      tags: [Zoom]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: receiptId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 3, maxLength: 300, description: No personal data}
      responses:
        '204': {description: Requeued, due now, attempts reset}
        '400': {description: Missing or unsuitable reason}
        '404': {description: Not found in this academy}
        '409': {description: Not a dead letter}
  /api/v1/zoom/occurrences:
    get:
      summary: Zoom webinar occurrences seen in events and their class links, newest first (implemented; owner/admin)
      operationId: listZoomOccurrences
      tags: [Zoom]
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: decided, required: false, schema: {type: boolean}, description: false = waiting for review}
        - {in: query, name: sessionId, required: false, schema: {type: string, format: uuid}}
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Occurrences
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ZoomOccurrence'}}
  /api/v1/zoom/occurrence-links:
    post:
      summary: Record an administrator's decision for an occurrence; audited (implemented; owner/admin)
      description: Replaces any earlier decision. sessionId null marks the occurrence "not a class". The matcher never changes a manual decision.
      operationId: decideZoomOccurrence
      tags: [Zoom]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [occurrenceUuid, reason]
              properties:
                occurrenceUuid: {type: string, maxLength: 100}
                sessionId: {type: [string, 'null'], format: uuid}
                reason: {type: string, minLength: 3, maxLength: 300}
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ZoomOccurrence'}
        '404': {description: Occurrence or class session not found in this academy}
        '409': {description: The class session is cancelled}
  /api/v1/zoom/occurrences/auto-link:
    post:
      summary: Re-run automatic matching for undecided occurrences (implemented; owner/admin)
      operationId: autoLinkZoomOccurrences
      tags: [Zoom]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                required: [linked, stillUndecided]
                properties:
                  linked: {type: integer}
                  stillUndecided: {type: integer}
  /api/v1/zoom/reports:
    post:
      summary: Fetch Zoom's participant report for an ended occurrence now (implemented, 004B; owner/admin; audited)
      description: |
        Reports are also fetched automatically for ended occurrences linked to a class (luma.zoom.reports.*), retried
        with backoff and Zoom's Retry-After. A fetched report replaces the live events in attendance; a later failure
        never discards it. Stored rows keep email, display name, registrant ID, join/leave times and duration only.
      operationId: fetchZoomReport
      tags: [Zoom]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [occurrenceUuid]
              properties:
                occurrenceUuid: {type: string, maxLength: 100}
      responses:
        '200':
          description: Outcome (a Zoom failure is reported here with status FAILED)
          content:
            application/json:
              schema:
                type: object
                required: [occurrenceUuid, status]
                properties:
                  occurrenceUuid: {type: string}
                  status: {type: string, enum: [FETCHED, FAILED]}
                  joinSessions: {type: integer, nullable: true}
                  error: {type: string, nullable: true, description: Zoom's HTTP status and error code, never response content}
        '404': {description: Unknown occurrence}
        '409': {description: The webinar has not ended, or the Zoom API is not configured}
  /api/v1/zoom/participants:
    get:
      summary: People in a Zoom occurrence and the student each is matched to (implemented; owner/admin)
      description: |
        Provisional live data, not attendance. A person is identified by the email Zoom reports (lower-cased),
        never by display name; a visitor without email is listed alone and stays unmatched. Matching order: an
        administrator's decision for the email, then a student's LUMA sign-in email. The host is listed as HOST.
        Unmatched people come first.
      operationId: listZoomParticipants
      tags: [Zoom]
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: occurrence, required: true, description: Occurrence UUID, schema: {type: string, maxLength: 100}}
      responses:
        '200':
          description: Participants
          content:
            application/json:
              schema:
                type: object
                required: [occurrenceUuid, participants]
                properties:
                  occurrenceUuid: {type: string}
                  classSessionId: {type: string, format: uuid, nullable: true}
                  participants:
                    type: array
                    items:
                      type: object
                      required: [visits, openVisits, firstSeenAt, lastSeenAt, match]
                      properties:
                        email: {type: string, nullable: true}
                        displayName: {type: string, nullable: true}
                        visits: {type: integer, description: Separate joins; a rejoin is a new visit}
                        openVisits: {type: integer, description: Visits with a join but no leave yet}
                        firstSeenAt: {type: string, format: date-time}
                        lastSeenAt: {type: string, format: date-time}
                        match: {type: string, enum: [STUDENT, NOT_A_STUDENT, UNMATCHED, HOST]}
                        matchSource: {type: string, enum: [MANUAL, SIGN_IN_EMAIL], nullable: true}
                        studentId: {type: string, format: uuid, nullable: true}
                        studentNumber: {type: string, nullable: true}
                        studentName: {type: string, nullable: true}
                        expected: {type: boolean, nullable: true, description: Expected at the linked class; null when not linked or not a student}
        '404': {description: No such occurrence in the caller's academy}
  /api/v1/zoom/participants/unmatched:
    get:
      summary: Zoom emails matching no student and with no decision, most recently seen first (implemented; owner/admin)
      operationId: listUnmatchedZoomParticipants
      tags: [Zoom]
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Emails for review
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [email, occurrences, lastSeenAt]
                  properties:
                    email: {type: string}
                    displayName: {type: string, nullable: true}
                    occurrences: {type: integer}
                    lastSeenAt: {type: string, format: date-time}
  /api/v1/zoom/identity-links:
    get:
      summary: Administrators' decisions about Zoom emails, newest first (implemented; owner/admin)
      operationId: listZoomIdentityLinks
      tags: [Zoom]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Decisions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ZoomIdentityDecision'}
    post:
      summary: Record which student a Zoom email belongs to, or that it is not a student (implemented; owner/admin; audited)
      description: Replaces any earlier decision for the email and applies to every webinar. The email must have been seen in the academy's Zoom events.
      operationId: decideZoomIdentity
      tags: [Zoom]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, reason]
              properties:
                email: {type: string, maxLength: 254}
                studentId: {type: string, format: uuid, nullable: true, description: null marks the email "not a student"}
                reason: {type: string, minLength: 3, maxLength: 300}
      responses:
        '200':
          description: The decision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ZoomIdentityDecision'}
        '400': {description: Invalid email or reason}
        '404': {description: Email never seen in Zoom, or student not in the academy}
  /api/v1/class-sessions/{sessionId}/attendance:
    get:
      summary: Provisional attendance from live Zoom events (implemented, 004A; reconciliation is 004B)
      description: |
        Recalculated on every read. Facts only, never present/absent: time connected within the class time with rejoins
        merged, first join and seconds after the start, visits and visits with no leave yet (counted to the webinar's end,
        or to now while it runs). Expected students are listed even if not seen; not seen is not proof of absence.
        Owners/admins also see matched students who were not expected. Batch-scoped staff see only their classes and
        students; others get 404.
      operationId: getProvisionalAttendance
      security: [{bearerAuth: []}]
      tags: [Attendance]
      parameters:
        - {in: path, name: sessionId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Provisional attendance
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, status, classStartsAt, classEndsAt, linkedOccurrences, webinarEnded, unmatchedPeople, calculatedAt, students]
                properties:
                  sessionId: {type: string, format: uuid}
                  status: {type: string, enum: [PROVISIONAL, RECONCILED], description: RECONCILED when every linked occurrence is counted from Zoom's participant report; neither is a present/absent decision}
                  classStartsAt: {type: string, format: date-time}
                  classEndsAt: {type: string, format: date-time}
                  linkedOccurrences: {type: integer}
                  reportedOccurrences: {type: integer}
                  webinarEnded: {type: boolean, description: Every linked occurrence reported webinar.ended}
                  unmatchedPeople: {type: integer}
                  calculatedAt: {type: string, format: date-time}
                  students:
                    type: array
                    items:
                      type: object
                      required: [studentId, studentNumber, fullName, expected, seen, visits, openVisits, connectedSeconds]
                      properties:
                        studentId: {type: string, format: uuid}
                        studentNumber: {type: string}
                        fullName: {type: string}
                        expected: {type: boolean}
                        seen: {type: boolean}
                        visits: {type: integer}
                        openVisits: {type: integer}
                        connectedSeconds: {type: integer}
                        firstJoinAt: {type: string, format: date-time, nullable: true}
                        secondsAfterStart: {type: integer, nullable: true}
        '404': {description: Class not found or not visible to the caller}
  /api/v1/class-sessions/{sessionId}/attendance/export:
    get:
      summary: The class's attendance facts as CSV (implemented, 005A; audited ATTENDANCE_EXPORTED)
      description: The same rows and scoping as GET .../attendance for the caller.
      operationId: exportClassAttendance
      security: [{bearerAuth: []}]
      tags: [Attendance]
      parameters:
        - {in: path, name: sessionId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: |
            text/csv (UTF-8, CRLF), Content-Disposition attachment, Cache-Control no-store. Columns: class_date, class_start,
            class_end, time_zone, class_title, class_status, data_source (PROVISIONAL or RECONCILED), student_number,
            student_name, expected, seen, visits, visits_without_leave, minutes_connected, first_join, minutes_after_start.
            Times are in the class's own zone. Cells starting with = + - @ tab or CR are prefixed with an apostrophe.
          content:
            text/csv:
              schema: {type: string}
        '404': {description: Class not found or not visible to the caller}
  /api/v1/batches/{batchId}/attendance/export:
    get:
      summary: A batch's attendance facts over a date range as CSV (implemented, 005A; audited ATTENDANCE_EXPORTED)
      description: Classes of the batch whose own date is from..to (inclusive, at most 92 days); only students of that batch.
      operationId: exportBatchAttendance
      security: [{bearerAuth: []}]
      tags: [Attendance]
      parameters:
        - {in: path, name: batchId, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: from, required: true, schema: {type: string, format: date}}
        - {in: query, name: to, required: true, schema: {type: string, format: date}}
      responses:
        '200':
          description: |
            text/csv (UTF-8, CRLF), Content-Disposition attachment, Cache-Control no-store. Columns: class_date, class_start,
            class_end, time_zone, class_title, class_status, data_source (PROVISIONAL or RECONCILED), student_number,
            student_name, expected, seen, visits, visits_without_leave, minutes_connected, first_join, minutes_after_start.
            Times are in the class's own zone. Cells starting with = + - @ tab or CR are prefixed with an apostrophe.
          content:
            text/csv:
              schema: {type: string}
        '400': {description: Missing or invalid range}
        '404': {description: Batch not found or not visible to the caller}
  /api/v1/attendance-policy:
    get:
      summary: The academy's attendance rule (implemented, 004B; staff with attendance access)
      operationId: getAttendancePolicy
      tags: [Attendance]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: The rule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttendancePolicy'}
        '204': {description: No rule recorded yet; nothing can be finalised}
    put:
      summary: Record or change the rule (owners only; versioned; audited ATTENDANCE_POLICY_SET)
      operationId: setAttendancePolicy
      tags: [Attendance]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minConnectedPercent, lateAfterMinutes, description]
              properties:
                minConnectedPercent: {type: integer, minimum: 1, maximum: 100}
                lateAfterMinutes: {type: integer, minimum: 0, maximum: 240}
                description: {type: string, maxLength: 500, description: Where the rule was approved}
                version: {type: integer, nullable: true, description: null for the first rule; otherwise the version read}
      responses:
        '200':
          description: The saved rule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttendancePolicy'}
        '403': {description: Not an owner}
        '409': {description: Changed by someone else}
  /api/v1/class-sessions/{sessionId}/attendance/finalisation:
    post:
      summary: Finalise a class's attendance by the academy's rule (implemented, 004B; owners/admins; audited ATTENDANCE_FINALISED)
      description: |
        Only when a rule is recorded, the class is scheduled and over, and every linked occurrence is counted from Zoom's
        participant report (RECONCILED). One record per expected student (PRESENT, LATE or ABSENT), with the facts and the
        rule used. Once per class; later changes are corrections.
      operationId: finaliseAttendance
      tags: [Attendance]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: sessionId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: {type: string, format: uuid}
                  finalisedAt: {type: string, format: date-time}
                  present: {type: integer}
                  late: {type: integer}
                  absent: {type: integer}
        '409': {description: No rule, not finished, cancelled, not reconciled, or already final}
  /api/v1/attendance-records/{recordId}/corrections:
    get:
      summary: A final record's corrections, oldest first (implemented, 004C; staff who see the student at the class)
      operationId: listAttendanceCorrections
      tags: [Attendance]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: recordId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: "Corrections: previousOutcome, newOutcome, reason, appealId, correctedAt"}
    post:
      summary: Correct a final record with a reason (owners, admins, attendance officers for their batches; audited ATTENDANCE_CORRECTED)
      description: Append-only history; the computed outcome is kept. Optimistic version.
      operationId: correctAttendance
      tags: [Attendance]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: recordId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, reason, version]
              properties:
                outcome: {type: string, enum: [PRESENT, LATE, ABSENT, EXCUSED]}
                reason: {type: string, maxLength: 500}
                version: {type: integer}
      responses:
        '200': {description: The record with the outcome in force}
        '409': {description: Changed by someone else}
  /api/v1/students/{studentId}/attendance:
    get:
      summary: A student's final attendance history (implemented, 004C; owners/admins)
      operationId: studentAttendanceHistory
      tags: [Attendance]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: studentId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: "Records newest first: class, computed and in-force outcome, facts, latest appeal status"}
  /api/v1/me/attendance:
    get:
      summary: The signed-in student's final attendance (implemented, 004C)
      operationId: myAttendance
      tags: [Attendance]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: The student's own records}
  /api/v1/me/attendance/{recordId}/appeals:
    post:
      summary: Appeal one's own final record (implemented, 004C; one open appeal per record; audited)
      operationId: appealAttendance
      tags: [Attendance]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: recordId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string, minLength: 10, maxLength: 1000}
      responses:
        '201': {description: The appeal}
        '404': {description: Not the student's record}
        '409': {description: An appeal is already open}
  /api/v1/attendance-appeals:
    get:
      summary: Appeals, newest first (implemented, 004C; owners/admins)
      operationId: listAttendanceAppeals
      tags: [Attendance]
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: status, required: false, schema: {type: string, enum: [OPEN, ACCEPTED, REJECTED]}}
      responses:
        '200': {description: Appeals with student, class, message and status}
  /api/v1/attendance-appeals/{appealId}/resolution:
    post:
      summary: Accept (correcting the record) or reject an appeal, with a note the student sees (implemented, 004C; audited)
      operationId: resolveAttendanceAppeal
      tags: [Attendance]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: appealId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, note]
              properties:
                decision: {type: string, enum: [ACCEPT, REJECT]}
                outcome: {type: string, enum: [PRESENT, LATE, ABSENT, EXCUSED], description: Required when accepting}
                note: {type: string, maxLength: 500}
      responses:
        '200': {description: The decided appeal}
        '409': {description: Already decided}
  /api/v1/zoom/webhooks:
    post:
      summary: Signed Zoom webhook ingress (implemented; off unless configured; verified against fixtures only)
      description: |
        No academy JWT: the Zoom signature is the credential. Requires x-zm-request-timestamp (epoch seconds,
        within 5 minutes) and x-zm-signature = "v0=" + hex HMAC-SHA256(secret token, "v0:<timestamp>:<raw body>").
        endpoint.url_validation is answered; webinar.started/ended/participant_joined/participant_left are stored
        durably before the 2xx; other verified types are acknowledged and dropped. Redeliveries of an identical body
        are acknowledged without a second receipt.
      operationId: receiveZoomWebhook
      tags: [Zoom]
      security: []
      parameters:
        - {in: header, name: x-zm-request-timestamp, required: true, schema: {type: string}}
        - {in: header, name: x-zm-signature, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [event], properties: {event: {type: string}, event_ts: {type: integer}, payload: {type: object}}}
      responses:
        '200':
          description: Stored, already stored, or ignored; for url_validation the body holds plainToken and encryptedToken
          content:
            application/json:
              schema:
                type: object
                properties:
                  plainToken: {type: string}
                  encryptedToken: {type: string}
        '400': {description: Verified but malformed (not a JSON object, no event, no event_ts, or unacceptable plainToken)}
        '401': {description: Missing, malformed, stale or mismatched signature (empty body)}
        '404': {description: Webhook ingress is not configured}
        '413': {description: Body over 64 KiB}
        '415': {description: Not application/json}
        '503': {description: Receipt could not be stored; Zoom retries 5xx}
components:
  schemas:
    AttendancePolicy:
      type: object
      required: [minConnectedPercent, lateAfterMinutes, description, version, updatedAt]
      properties:
        minConnectedPercent: {type: integer}
        lateAfterMinutes: {type: integer}
        description: {type: string}
        version: {type: integer}
        updatedAt: {type: string, format: date-time}
    ZoomIdentityDecision:
      type: object
      required: [email, reason, linkedAt]
      properties:
        email: {type: string}
        studentId: {type: string, format: uuid, nullable: true}
        studentNumber: {type: string, nullable: true}
        studentName: {type: string, nullable: true}
        reason: {type: string}
        linkedAt: {type: string, format: date-time}
    SystemStatus:
      type: object
      properties:
        service: {type: string, example: luma-api}
        status: {type: string, example: UP}
        stage: {type: string, example: BOOTSTRAP_ONLY}
        timestamp: {type: string, format: date-time}
      required: [service, status, stage, timestamp]
    AccessTokenResponse:
      type: object
      properties:
        accessToken: {type: string}
        tokenType: {type: string, example: Bearer}
        expiresIn: {type: integer, description: Seconds, example: 600}
        refreshToken: {type: string, description: Opaque single-use token}
        refreshExpiresIn: {type: integer, description: Seconds, example: 604800}
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn]
    MfaRequiredResponse:
      type: object
      required: [mfaRequired, mfaToken, mfaExpiresIn, mfaEnrolled]
      properties:
        mfaRequired: {type: boolean, const: true}
        mfaToken: {type: string, description: Short-lived challenge consumed on successful verification}
        mfaExpiresIn: {type: integer, description: Seconds, example: 300}
        mfaEnrolled: {type: boolean, description: False means the client must call mfa/enroll first}
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: {type: string, maxLength: 128, writeOnly: true}
    Identity:
      type: object
      properties:
        accountId: {type: string, format: uuid}
        academyId: {type: string, format: uuid}
        roles:
          type: array
          items: {type: string, enum: [ACADEMY_OWNER, ACADEMY_ADMIN, INSTRUCTOR, ATTENDANCE_OFFICER, ANALYST, STUDENT]}
      required: [accountId, academyId, roles]
    Course:
      type: object
      required: [id, code, title, active, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        title: {type: string}
        active: {type: boolean}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Batch:
      type: object
      required: [id, courseId, code, name, startsOn, endsOn, active, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        startsOn: {type: string, format: date}
        endsOn: {type: [string, 'null'], format: date}
        active: {type: boolean}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Student:
      type: object
      required: [id, studentNumber, fullName, accountId, active, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        studentNumber: {type: string}
        fullName: {type: string}
        email: {type: [string, 'null']}
        accountId: {type: string, format: uuid}
        accountStatus: {type: [string, 'null'], enum: [PENDING_ACTIVATION, ACTIVE, DISABLED, null]}
        active: {type: boolean}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Enrollment:
      type: object
      required: [id, batchId, courseId, batchCode, batchName, studentId, studentNumber, studentName, enrolledOn, status, version]
      properties:
        id: {type: string, format: uuid}
        batchId: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        batchCode: {type: string}
        batchName: {type: string}
        studentId: {type: string, format: uuid}
        studentNumber: {type: string}
        studentName: {type: string}
        enrolledOn: {type: string, format: date}
        withdrawnOn: {type: [string, 'null'], format: date}
        status: {type: string, enum: [ENROLLED, WITHDRAWN]}
        version: {type: integer}
    Assignment:
      type: object
      required: [id, batchId, courseId, batchCode, batchName, accountId, role, createdAt]
      properties:
        id: {type: string, format: uuid}
        batchId: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        batchCode: {type: string}
        batchName: {type: string}
        accountId: {type: string, format: uuid}
        email: {type: [string, 'null']}
        role: {type: string, enum: [INSTRUCTOR, ATTENDANCE_OFFICER]}
        createdAt: {type: string, format: date-time}
    StudentClass:
      type: object
      required: [id, title, startsAt, endsAt, timeZone, localDate, status, batches]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        timeZone: {type: string, example: Asia/Colombo}
        localDate: {type: string, format: date}
        status: {type: string, enum: [SCHEDULED, CANCELLED]}
        batches:
          type: array
          description: Only the student's own batches enrolled on localDate
          items:
            type: object
            required: [batchId, code, name]
            properties:
              batchId: {type: string, format: uuid}
              code: {type: string}
              name: {type: string}
    ClassSession:
      type: object
      required: [id, title, startsAt, endsAt, timeZone, localDate, status, batches, version, createdAt, updatedAt]
      properties:
        seriesId: {type: string, format: uuid, nullable: true, description: Set on classes created together as a weekly series}
        id: {type: string, format: uuid}
        title: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        timeZone: {type: string}
        localDate: {type: string, format: date, description: Calendar date of the class in its time zone}
        status: {type: string, enum: [SCHEDULED, CANCELLED]}
        zoomWebinarId: {type: [string, 'null']}
        batches:
          type: array
          items:
            type: object
            required: [batchId, courseId, code, name]
            properties:
              batchId: {type: string, format: uuid}
              courseId: {type: string, format: uuid}
              code: {type: string}
              name: {type: string}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    StaffRole:
      type: string
      enum: [ACADEMY_OWNER, ACADEMY_ADMIN, INSTRUCTOR, ATTENDANCE_OFFICER, ANALYST]
    StaffAccount:
      type: object
      required: [id, email, roles, status, mfaEnrolled, version, createdAt]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        roles: {type: array, items: {$ref: '#/components/schemas/StaffRole'}}
        status: {type: string, enum: [PENDING_ACTIVATION, ACTIVE, DISABLED]}
        mfaEnrolled: {type: boolean}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
    ZoomOccurrence:
      type: object
      required: [occurrenceUuid, webinarId, firstEventAt, lastEventAt, eventCount]
      properties:
        occurrenceUuid: {type: string}
        webinarId: {type: string}
        firstEventAt: {type: string, format: date-time}
        lastEventAt: {type: string, format: date-time}
        eventCount: {type: integer}
        classSessionId: {type: [string, 'null'], format: uuid}
        linkSource: {type: [string, 'null'], enum: [AUTOMATIC, MANUAL, null]}
        linkedAt: {type: [string, 'null'], format: date-time}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
