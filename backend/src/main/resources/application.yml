spring:
  application:
    name: luma-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/luma}
    username: ${DB_USERNAME:luma_dev}
    password: ${DB_PASSWORD:local-only-change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
