spring:
  application:
    name: luma-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/luma}
    username: ${DB_USERNAME:luma_dev}
    password: ${DB_PASSWORD:local-only-change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
luma:
  auth:
    issuer: ${LUMA_AUTH_ISSUER:http://localhost:8080}
    audience: ${LUMA_AUTH_AUDIENCE:luma-api}
    access-token-ttl: ${LUMA_AUTH_ACCESS_TOKEN_TTL:PT10M}
    # PKCS#8 RSA private key (2048 bits or more) from a secrets manager. Never commit one.
    signing-key-pem: ${LUMA_AUTH_SIGNING_KEY_PEM:}
    # Comma-separated X.509 public keys of retired signing keys whose tokens may still be valid.
    verification-keys-pem: ${LUMA_AUTH_VERIFICATION_KEYS_PEM:}
    # Local development and tests only: generate a throwaway key at startup.
    ephemeral-signing-key: ${LUMA_AUTH_EPHEMERAL_SIGNING_KEY:false}
    refresh-token-ttl: ${LUMA_AUTH_REFRESH_TOKEN_TTL:P7D}
    session-max-lifetime: ${LUMA_AUTH_SESSION_MAX_LIFETIME:P30D}
    # Base64 of 32 random bytes from a secrets manager; encrypts authenticator secrets at rest.
    # Losing or changing it makes every enrolled authenticator unusable.
    mfa-encryption-key: ${LUMA_AUTH_MFA_ENCRYPTION_KEY:}
  mail:
    # Email to account holders (invitations, password resets) stays off until an SMTP server
    # is configured with SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME and
    # SPRING_MAIL_PASSWORD. While off, self-service reset answers 503 and invitations are links.
    enabled: ${LUMA_MAIL_ENABLED:false}
    # Sender address the SMTP provider allows, e.g. no-reply@academy.example.
    from: ${LUMA_MAIL_FROM:}
    # Where people open emailed links: the Next.js origin, https except for localhost.
    web-origin: ${LUMA_MAIL_WEB_ORIGIN:}
  password-reset:
    ttl: ${LUMA_PASSWORD_RESET_TTL:PT30M}
    max-requests-per-hour: ${LUMA_PASSWORD_RESET_MAX_REQUESTS_PER_HOUR:3}
  zoom:
    webhook:
      # Webhook ingress stays off (404) until a secret token is set. Never commit one.
      secret-token: ${LUMA_ZOOM_WEBHOOK_SECRET_TOKEN:}
      academy-id: ${LUMA_ZOOM_WEBHOOK_ACADEMY_ID:}
      max-clock-skew: ${LUMA_ZOOM_WEBHOOK_MAX_CLOCK_SKEW:PT5M}
    processing:
      # Polls stored webhook receipts in this process; safe with several instances.
      enabled: ${LUMA_ZOOM_PROCESSING_ENABLED:true}
      poll-interval: ${LUMA_ZOOM_PROCESSING_POLL_INTERVAL:PT5S}
